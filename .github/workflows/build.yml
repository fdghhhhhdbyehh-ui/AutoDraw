              void rotateImage() {
                  if (pixels == null) {
                      Toast.makeText(this, "اختر صورة أولاً", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  int[] out = new int[pixels.length];
                  for (int y = 0; y < ph; y++) {
                      for (int x = 0; x < pw; x++) {
                          out[x * ph + (ph - 1 - y)] = pixels[y * pw + x];
                      }
                  }
                  pixels = out;
                  int t = pw;
                  pw = ph;
                  ph = t;
                  process();
              }

              int clamp255(int v) {
                  return v < 0 ? 0 : Math.min(v, 255);
              }

              int[] adjust(int[] src, int w, int h, boolean invert, boolean flip, int contrastP) {
                  if (!invert && !flip && contrastP == 50) return src;
                  float f = (float) Math.pow(2.5, (contrastP - 50) / 50.0);
                  int[] out = new int[src.length];
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          int c = src[y * w + (flip ? w - 1 - x : x)];
                          int r = (c >> 16) & 255, g = (c >> 8) & 255, b = c & 255;
                          if (contrastP != 50) {
                              r = clamp255((int) ((r - 128) * f + 128));
                              g = clamp255((int) ((g - 128) * f + 128));
                              b = clamp255((int) ((b - 128) * f + 128));
                          }
                          if (invert) {
                              r = 255 - r;
                              g = 255 - g;
                              b = 255 - b;
                          }
                          out[y * w + x] = 0xFF000000 | (r << 16) | (g << 8) | b;
                      }
                  }
                  return out;
              }

              float strokeLen(float[] s) {
                  float len = 0;
                  for (int k = 2; k < s.length; k += 2) len += (float) Math.hypot(s[k] - s[k - 2], s[k + 1] - s[k - 1]);
                  return len;
              }

              List<Tracer.StrokeItem> filterItems(Tracer.Result r) {
                  int min = minLenSeek.getProgress();
                  List<Tracer.StrokeItem> out = new ArrayList<>();
                  for (int i = 0; i < r.items.size(); i++) {
                      Tracer.StrokeItem it = r.items.get(i);
                      if (min <= 0 || i < r.fillCount || strokeLen(it.pts) >= min) {
                          out.add(it);
                      }
                  }
                  return out.isEmpty() ? r.items : out;
              }

              float currentSpeed() {
                  return 60f + speed.getProgress() * 4f;
              }

              @Override
              protected void onActivityResult(int rc, int res, Intent data) {
                  super.onActivityResult(rc, res, data);
                  if (rc == 1 && res == RESULT_OK && data != null && data.getData() != null) {
                      load(data.getData());
                  }
              }

              void load(Uri uri) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          BitmapFactory.decodeStream(in, null, o);
                      }
                      int ss = 1;
                      while (Math.max(o.outWidth, o.outHeight) / ss > 2000) ss *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = ss;
                      Bitmap full;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          full = BitmapFactory.decodeStream(in, null, o);
                      }
                      float k = Math.min(3f, 900f / Math.max(full.getWidth(), full.getHeight()));
                      pw = Math.max(16, (int) (full.getWidth() * k));
                      ph = Math.max(16, (int) (full.getHeight() * k));
                      Bitmap scaled = Bitmap.createScaledBitmap(full, pw, ph, true);
                      Bitmap flat = Bitmap.createBitmap(pw, ph, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(flat);
                      c.drawColor(Color.WHITE);
                      c.drawBitmap(scaled, 0, 0, null);
                      pixels = new int[pw * ph];
                      flat.getPixels(pixels, 0, pw, 0, 0, pw, ph);
                      imageRow.sub.setText("تم اختيار الصورة ✓  (اضغط للتغيير)");
                      imageRow.sub.setTextColor(0xFF7DDC98);
                      process();
                  } catch (Exception e) {
                      Toast.makeText(this, "تعذر فتح الصورة", Toast.LENGTH_SHORT).show();
                  }
              }

              void process() {
                  if (pixels == null) return;
                  final int id = ++jobId;
                  final int d = detail.getProgress();
                  final boolean fl = fillSwitch.isChecked();
                  final int[] px = pixels;
                  final int w = pw, h = ph;
                  final boolean inv = invertSwitch.isChecked();
                  final boolean flp = flipSwitch.isChecked();
                  final int con = contrastSeek.getProgress();
                  info.setText("جارٍ استخراج الخطوط...");
                  strokesChip.setText("✎  …");
                  timeChip.setText("⏱  …");
                  new Thread(() -> {
                      try {
                          final Tracer.Result r = Tracer.trace(adjust(px, w, h, inv, flp, con), w, h, d, fl);
                          final Bitmap pvb = render(r);
                          runOnUiThread(() -> {
                              if (id != jobId) return;
                              result = r;
                              setPreviewEmpty(false);
                              placeholder.setVisibility(View.GONE);
                              preview.setAlpha(0f);
                              preview.setImageBitmap(pvb);
                              preview.animate().alpha(1f).setDuration(300).start();
                              updateInfo();
                          });
                      } catch (Throwable t) {
                          final String msg = String.valueOf(t);
                          runOnUiThread(() -> info.setText("خطأ: " + msg));
                      }
                  }).start();
              }

              Bitmap render(Tracer.Result r) {
                  int rw = Math.max(1, r.w), rh = Math.max(1, r.h);
                  float sc = Math.min(1000f / rw, 1400f / rh);
                  Bitmap bm = Bitmap.createBitmap((int) (rw * sc) + 8, (int) (rh * sc) + 8, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(bm);
                  cv.drawColor(Color.WHITE);
                  Paint p = new Paint();
                  p.setColor(Color.BLACK);
                  p.setAntiAlias(true);
                  p.setStrokeCap(Paint.Cap.ROUND);
                  float fw = Math.max(2f, r.fillW * sc * 1.1f);
                  for (int si = 0; si < r.items.size(); si++) {
                      Tracer.StrokeItem it = r.items.get(si);
                      float[] s = it.pts;
                      p.setStrokeWidth(si < r.fillCount ? fw : (it.repeats >= 2 ? 3.2f : 1.8f));
                      for (int k = 2; k < s.length; k += 2) {
                          cv.drawLine(s[k - 2] * sc + 4, s[k - 1] * sc + 4, s[k] * sc + 4, s[k + 1] * sc + 4, p);
                      }
                  }
                  return bm;
              }

              void updateInfo() {
                  float sp = currentSpeed();
                  speedValue.setText((int) sp + " بكسل/ث");
                  if (result == null) {
                      info.setText("الأقل = أبطأ في سرعة الرسم");
                      return;
                  }
                  int secs = (int) (result.totalLen * 1.35f / sp);
                  String t = secs >= 60 ? (secs / 60) + " دقيقة" : secs + " ثانية";
                  strokesChip.setText("✎  " + result.totalRepeats + " ضربة");
                  timeChip.setText("⏱  ≈ " + t);
                  info.setText("الداكن ×2 · الرفيع ×1 · اضغط على المعاينة لتغيير الصورة");
              }

              void start() {
                  if (!License.canUse(this)) {
                      showCodeDialog(true);
                      return;
                  }
                  if (result == null || result.items.isEmpty()) {
