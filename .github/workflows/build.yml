                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  if (Build.VERSION.SDK_INT >= 31) {
                      lp.flags |= WindowManager.LayoutParams.FLAG_BLUR_BEHIND;
                      lp.setBlurBehindRadius(25);
                  }
                  try {
                      wm.addView(root, lp);
                      paywall = root;
                  } catch (Exception e) {
                      paywall = null;
                  }
              }

              void removePaywall() {
                  try { if (paywall != null) wm.removeView(paywall); } catch (Exception e) {}
                  paywall = null;
              }

              void prepareStart() {
                  final float x1 = region.left, y1 = region.top, y2 = region.bottom;
                  float rw = region.width(), rh = region.height();
                  if (rw < 100 || rh < 100) {
                      Toast.makeText(this, "المنطقة صغيرة جداً، حدد موقعاً أكبر", Toast.LENGTH_LONG).show();
                      return;
                  }
                  final float sc = Math.min(rw / imgW, rh / imgH);
                  final float ox = x1 + (rw - imgW * sc) / 2f;
                  final float oy = y1 + (rh - imgH * sc) / 2f;
                  showFrame(ox, oy, imgW * sc, imgH * sc);
                  setFab("إلغاء", 11);
                  pendingBegin = () -> {
                      pendingBegin = null;
                      try {
                          beginDraw(x1, y1, y2, ox, oy, sc);
                      } catch (Exception e) {
                          finishDraw("خطأ");
                      }
                  };
                  h.postDelayed(pendingBegin, startDelayMs);
              }

              void showFrame(float ox, float oy, float w, float hh) {
                  removeFrame();
                  try {
                      frame = new View(this);
                      GradientDrawable gd = new GradientDrawable();
                      gd.setColor(0x00000000);
                      gd.setStroke(5, 0xFFFF1744);
                      frame.setBackground(gd);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              Math.max(1, (int) w), Math.max(1, (int) hh),
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.TOP | Gravity.LEFT;
                      lp.x = (int) ox;
                      lp.y = (int) oy;
                      wm.addView(frame, lp);
                  } catch (Exception e) {
                      frame = null;
                  }
              }

              void beginDraw(float x1, float y1, float y2, float ox, float oy, float sc) {
                  removeFrame();
                  License.consume(this);
                  plan = buildPlan(ox, oy, sc);
                  drawing = true;
                  cancel = false;
                  paused = false;
                  loopWaiting = false;
                  okCount = 0;
                  failCount = 0;
                  if (fab != null) {
                      setFab("✎", 22);
                      int size = fabLp.width;
                      int screenH = getResources().getDisplayMetrics().heightPixels;
                      int ny = (int) y2 + 15;
                      if (ny + size > screenH) ny = Math.max(0, (int) y1 - size - 15);
                      fabLp.x = (int) x1;
                      fabLp.y = ny;
                      try { wm.updateViewLayout(fab, fabLp); } catch (Exception e) {}
                  }
                  String left = License.unlocked(this) ? "" : "  |  محاولات متبقية: " + License.remaining(this);
                  Toast.makeText(this, "بدأ الرسم: " + plan.size() + " ضربة" + left, Toast.LENGTH_SHORT).show();
                  drawNext(0);
              }

              float length(float[] t) {
                  float len = 0;
                  for (int k = 2; k < t.length; k += 2) len += (float) Math.hypot(t[k] - t[k - 2], t[k + 1] - t[k - 1]);
                  return len;
              }

              /** يحوّل الخطوط إلى ضربات دون ترك الخطوط، ويكرر الداكن مرتين والرفيع مرة واحدة */
              List<Piece> buildPlan(float ox, float oy, float sc) {
                  Random rnd = new Random();
                  List<Tracer.StrokeItem> ordered = new ArrayList<>(strokeItems);
                  if (topDown) {
                      ordered.sort((a, b) -> Float.compare(a.pts[1], b.pts[1]));
                  }

                  List<Piece> out = new ArrayList<>();
                  float drift = 1f, wx = 0, wy = 0;

                  for (Tracer.StrokeItem it : ordered) {
                      float[] basePts = new float[it.pts.length];
                      for (int k = 0; k < it.pts.length; k += 2) {
                          basePts[k] = ox + (it.pts[k] + 0.5f) * sc;
                          basePts[k + 1] = oy + (it.pts[k + 1] + 0.5f) * sc;
                      }
                      float len = length(basePts);
                      if (len < 1.5f) continue;

                      int reps = Math.max(1, it.repeats);
                      for (int rep = 0; rep < reps; rep++) {
                          float[] pts = basePts.clone();
                          if (human) {
                              for (int k = 0; k < pts.length; k += 2) {
                                  wx = 0.7f * wx + 0.3f * (float) rnd.nextGaussian() * 0.7f;
                                  wy = 0.7f * wy + 0.3f * (float) rnd.nextGaussian() * 0.7f;
                                  pts[k] += wx;
                                  pts[k + 1] += wy;
                              }
                          }
                          Piece pc = new Piece();
                          pc.pts = pts;
                          float sp = speed;
                          if (human) {
                              drift = Math.max(0.85f, Math.min(1.2f, drift + (rnd.nextFloat() - 0.5f) * 0.1f));
                              sp = speed * drift * (0.85f + rnd.nextFloat() * 0.3f);
                          }
                          pc.dur = (long) Math.max(140f, Math.min(59000f, len / sp * 1000f));
                          pc.pause = human ? (25 + rnd.nextInt(120)) : 0;
                          out.add(pc);
                      }
                  }
                  return out;
              }

              void buzz() {
                  try {
                      Vibrator vb = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);
                      if (vb != null) vb.vibrate(VibrationEffect.createOneShot(250, VibrationEffect.DEFAULT_AMPLITUDE));
                  } catch (Exception e) {}
              }

              void finishDraw(String msg) {
                  drawing = false;
                  cancel = false;
                  paused = false;
                  loopWaiting = false;
                  setFab(okCount + "✓\n" + failCount + "✗", 11);
                  if (vibrateOnFinish && msg.startsWith("انتهى")) buzz();
                  Toast.makeText(this, msg + "  (نجح " + okCount + " / فشل " + failCount + ")", Toast.LENGTH_LONG).show();
                  if (!License.canUse(this)) h.postDelayed(this::showPaywall, 1500);
              }

              void drawNext(int i) {
                  try {
                      drawPiece(i);
                  } catch (Exception e) {
                      finishDraw("خطأ: " + e);
                  }
              }

              void drawPiece(int i) {
                  if (cancel) { finishDraw("تم الإيقاف"); return; }
                  if (paused) {
                      resumeIdx = i;
                      loopWaiting = true;
                      return;
                  }
                  if (plan == null || i >= plan.size()) { finishDraw("انتهى الرسم"); return; }
                  final Piece pc = plan.get(i);
                  setFab("✎\n" + i + "/" + plan.size(), 11);
                  Path p = new Path();
                  p.moveTo(pc.pts[0], pc.pts[1]);
                  for (int k = 2; k < pc.pts.length; k += 2) p.lineTo(pc.pts[k], pc.pts[k + 1]);
                  GestureDescription gd = new GestureDescription.Builder()
                          .addStroke(new GestureDescription.StrokeDescription(p, 0, pc.dur))
                          .build();
                  GestureResultCallback cb = new GestureResultCallback() {
                      @Override public void onCompleted(GestureDescription g) {
                          okCount++;
                          h.postDelayed(() -> drawNext(i + 1), delayMs + pc.pause);
                      }
                      @Override public void onCancelled(GestureDescription g) {
                          failCount++;
                          h.postDelayed(() -> drawNext(i + 1), delayMs + pc.pause);
                      }
                  };
                  if (!dispatchGesture(gd, cb, null)) {
                      failCount++;
                      h.postDelayed(() -> drawNext(i + 1), delayMs + pc.pause);
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "APK ${{ github.run_number }}" \
            --notes "AutoDraw"
