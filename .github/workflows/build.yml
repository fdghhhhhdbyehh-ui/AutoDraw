          cat > app/src/main/java/com/autodraw/DrawService.java <<'EOF'
          package com.autodraw;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Random;

          public class DrawService extends AccessibilityService {
              static DrawService instance;
              static List<float[]> strokes;
              static float imgW, imgH;
              static float speed = 160f;
              static boolean human = true;

              static class Piece {
                  float[] pts;
                  long dur;
                  long pause;
              }
              List<Piece> plan;

              WindowManager wm;
              TextView fab;
              WindowManager.LayoutParams fabLp;
              FrameLayout calib;
              TextView calibText;
              View frame;
              Runnable pendingBegin;
              final Handler h = new Handler(Looper.getMainLooper());
              boolean drawing, cancel;
              float cx1, cy1;
              int taps;
              int okCount, failCount;

              @Override
              protected void onServiceConnected() {
                  instance = this;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}

              @Override
              public boolean onUnbind(Intent i) {
                  instance = null;
                  hideAll();
                  return super.onUnbind(i);
              }

              void hideAll() {
                  removeFrame();
                  try { if (fab != null) wm.removeView(fab); } catch (Exception e) {}
                  try { if (calib != null) wm.removeView(calib); } catch (Exception e) {}
                  fab = null;
                  calib = null;
              }

              void removeFrame() {
                  try { if (frame != null) wm.removeView(frame); } catch (Exception e) {}
                  frame = null;
              }

              void setFab(String text, int size) {
                  if (fab == null) return;
                  fab.setTextSize(size);
                  fab.setText(text);
              }

              void showFab() {
                  if (fab != null) return;
                  fab = new TextView(this);
                  fab.setText("🎨");
                  fab.setTextSize(26);
                  fab.setGravity(Gravity.CENTER);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColors(new int[]{0xCC5AB0FF, 0xCC007AFF});
                  bg.setStroke(3, 0xAAFFFFFF);
                  fab.setTextColor(Color.WHITE);
                  fab.setBackground(bg);
                  int size = (int) (56 * getResources().getDisplayMetrics().density);
                  fabLp = new WindowManager.LayoutParams(size, size,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                          PixelFormat.TRANSLUCENT);
                  fabLp.gravity = Gravity.TOP | Gravity.LEFT;
                  fabLp.x = getResources().getDisplayMetrics().widthPixels - size - 20;
                  fabLp.y = 400;
                  fab.setOnTouchListener(new View.OnTouchListener() {
                      float sx, sy;
                      int ox, oy;
                      boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  sx = e.getRawX();
                                  sy = e.getRawY();
                                  ox = fabLp.x;
                                  oy = fabLp.y;
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  if (!moved && Math.abs(e.getRawX() - sx) + Math.abs(e.getRawY() - sy) > 20) moved = true;
                                  if (moved) {
                                      fabLp.x = (int) (ox + e.getRawX() - sx);
                                      fabLp.y = (int) (oy + e.getRawY() - sy);
                                      wm.updateViewLayout(fab, fabLp);
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) onFabClick();
                                  return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(fab, fabLp);
              }

              void onFabClick() {
                  if (drawing) {
                      cancel = true;
                  } else if (pendingBegin != null) {
                      h.removeCallbacks(pendingBegin);
                      pendingBegin = null;
                      removeFrame();
                      setFab("🎨", 26);
                  } else if (calib == null) {
                      startCalibration();
                  }
              }

              void startCalibration() {
                  if (strokes == null || strokes.isEmpty()) return;
                  setFab("🎨", 26);
                  taps = 0;
                  calib = new FrameLayout(this);
                  calib.setBackgroundColor(0x55000000);
                  calibText = new TextView(this);
                  calibText.setTextColor(Color.WHITE);
                  calibText.setTextSize(18);
                  calibText.setGravity(Gravity.CENTER);
                  GradientDrawable cbg = new GradientDrawable();
                  cbg.setColor(0xCC1C1C1E);
                  cbg.setCornerRadius(40);
                  cbg.setStroke(2, 0x66FFFFFF);
                  calibText.setBackground(cbg);
                  calibText.setPadding(30, 30, 30, 30);
                  calibText.setText("اضغط على الزاوية العلوية اليسرى للوحة الرسم");
                  FrameLayout.LayoutParams clp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP);
                  clp.setMargins(40, 90, 40, 0);
                  calib.addView(calibText, clp);
                  calib.setOnTouchListener((v, e) -> {
                      if (e.getAction() == MotionEvent.ACTION_UP) onCalibTap(e.getRawX(), e.getRawY());
                      return true;
                  });
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  wm.addView(calib, lp);
              }

              void onCalibTap(float x, float y) {
                  if (taps == 0) {
                      cx1 = x;
                      cy1 = y;
                      taps = 1;
                      calibText.setText("الآن اضغط على الزاوية السفلية اليمنى للوحة");
                      return;
                  }
                  try { wm.removeView(calib); } catch (Exception e) {}
                  calib = null;
                  final float x1 = cx1, y1 = cy1, x2 = x, y2 = y;
                  if (x2 - x1 < 100 || y2 - y1 < 100) {
                      Toast.makeText(this, "المنطقة غير صحيحة، اضغط الزر وحاول مرة أخرى", Toast.LENGTH_LONG).show();
                      return;
                  }
                  float rw = x2 - x1, rh = y2 - y1;
                  final float sc = Math.min(rw / imgW, rh / imgH);
                  final float ox = x1 + (rw - imgW * sc) / 2f;
                  final float oy = y1 + (rh - imgH * sc) / 2f;
                  // إطار أحمر يوضح مكان الرسم قبل البدء (اضغط الزر لإلغاء إن كان المكان خاطئاً)
                  showFrame(ox, oy, imgW * sc, imgH * sc);
                  setFab("إلغاء", 11);
                  pendingBegin = () -> {
                      pendingBegin = null;
                      try {
                          beginDraw(x1, y1, y2, ox, oy, sc);
                      } catch (Exception e) {
                          finishDraw("خطأ");
                      }
                  };
                  h.postDelayed(pendingBegin, 2000);
              }

              void showFrame(float ox, float oy, float w, float hh) {
                  removeFrame();
                  try {
                      frame = new View(this);
                      GradientDrawable gd = new GradientDrawable();
                      gd.setColor(0x00000000);
                      gd.setStroke(5, 0xFFFF1744);
                      frame.setBackground(gd);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              Math.max(1, (int) w), Math.max(1, (int) hh),
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.TOP | Gravity.LEFT;
                      lp.x = (int) ox;
                      lp.y = (int) oy;
                      wm.addView(frame, lp);
                  } catch (Exception e) {
                      frame = null;
                  }
              }

              void beginDraw(float x1, float y1, float y2, float ox, float oy, float sc) {
                  removeFrame();
                  plan = buildPlan(ox, oy, sc);
                  drawing = true;
                  cancel = false;
                  okCount = 0;
                  failCount = 0;
                  if (fab != null) {
                      setFab("⏹", 11);
                      // ننقل الزر خارج اللوحة حتى لا تصطدم به لمسات الرسم
                      int size = fabLp.width;
                      int screenH = getResources().getDisplayMetrics().heightPixels;
                      int ny = (int) y2 + 15;
                      if (ny + size > screenH) ny = Math.max(0, (int) y1 - size - 15);
                      fabLp.x = (int) x1;
                      fabLp.y = ny;
                      try { wm.updateViewLayout(fab, fabLp); } catch (Exception e) {}
                  }
                  Toast.makeText(this, "بدأ الرسم: " + plan.size() + " ضربة", Toast.LENGTH_SHORT).show();
                  drawNext(0);
              }

              float length(float[] t) {
                  float len = 0;
                  for (int k = 2; k < t.length; k += 2) len += (float) Math.hypot(t[k] - t[k - 2], t[k + 1] - t[k - 1]);
                  return len;
              }

              /** يحوّل الخطوط إلى ضربات قلم؛ في الوضع البشري: سرعات متغيرة، اهتزاز يد خفيف، رفع قلم وتوقفات طبيعية. */
              List<Piece> buildPlan(float ox, float oy, float sc) {
                  Random rnd = new Random();
                  List<float[]> screen = new ArrayList<>();
                  for (float[] s : strokes) {
                      float[] t = new float[s.length];
                      for (int k = 0; k < s.length; k += 2) {
                          t[k] = ox + (s[k] + 0.5f) * sc;
                          t[k + 1] = oy + (s[k + 1] + 0.5f) * sc;
                      }
                      screen.add(t);
                  }
                  if (human) {
                      // الإنسان يرسم الخطوط العامة الطويلة أولاً ثم التفاصيل
                      List<float[]> big = new ArrayList<>();
                      List<float[]> small = new ArrayList<>();
                      for (float[] t : screen) {
                          if (length(t) >= 120f) big.add(t); else small.add(t);
                      }
                      screen = big;
                      screen.addAll(small);
                  }
                  List<Piece> out = new ArrayList<>();
                  float drift = 1f, wx = 0, wy = 0;
                  for (float[] t : screen) {
                      float len = length(t);
                      if (len < 2f) continue;
                      float[] pts = t;
                      if (human) {
                          pts = t.clone();
                          for (int k = 0; k < pts.length; k += 2) {
                              wx = 0.75f * wx + 0.25f * (float) rnd.nextGaussian() * 1.1f;
                              wy = 0.75f * wy + 0.25f * (float) rnd.nextGaussian() * 1.1f;
                              pts[k] += wx;
                              pts[k + 1] += wy;
                          }
                      }
                      List<float[]> parts = new ArrayList<>();
                      int n = pts.length / 2;
                      if (human && len > 220f && n >= 6 && rnd.nextFloat() < 0.6f) {
                          int cut = 2 + rnd.nextInt(n - 4);
                          parts.add(Arrays.copyOfRange(pts, 0, 2 * (cut + 1)));
                          parts.add(Arrays.copyOfRange(pts, 2 * cut, pts.length));
                      } else {
                          parts.add(pts);
                      }
                      for (int pi = 0; pi < parts.size(); pi++) {
                          float[] q = parts.get(pi);
                          float ql = length(q);
                          if (ql < 2f) continue;
                          float sp = speed;
                          if (human) {
                              drift = Math.max(0.75f, Math.min(1.3f, drift + (rnd.nextFloat() - 0.5f) * 0.15f));
                              sp = speed * drift * (0.8f + rnd.nextFloat() * 0.45f);
                          }
                          sp = Math.max(1f, sp);
                          // الإيماءة الواحدة لا تتجاوز ~60 ثانية: السرعات البطيئة جداً تُقسَّم إلى أجزاء متصلة
                          List<float[]> chunks = chunk(q, sp * 50f);
                          for (int ci = 0; ci < chunks.size(); ci++) {
                              float[] cq = chunks.get(ci);
                              float cl = length(cq);
                              if (cl < 0.5f) continue;
                              Piece pc = new Piece();
                              pc.pts = cq;
                              pc.dur = (long) Math.max(150f, Math.min(59000f, cl / sp * 1000f));
                              boolean last = ci == chunks.size() - 1;
                              if (!last) {
                                  pc.pause = 0;
                              } else if (human) {
                                  pc.pause = 150 + rnd.nextInt(550);
                                  if (rnd.nextFloat() < 0.07f) pc.pause += 1200 + rnd.nextInt(1800);
                                  if (pi == 0 && parts.size() > 1) pc.pause = 30 + rnd.nextInt(120);
                              } else {
                                  pc.pause = 40;
                              }
                              out.add(pc);
                          }
                      }
                  }
                  return out;
              }

              /** يقسّم ضربة طويلة إلى أجزاء متصلة طول كل منها لا يتجاوز maxLen (حتى لا تزيد الإيماءة عن حدّ الزمن). */
              static List<float[]> chunk(float[] q, float maxLen) {
                  List<float[]> out = new ArrayList<>();
                  ArrayList<Float> cur = new ArrayList<>();
                  cur.add(q[0]);
                  cur.add(q[1]);
                  float acc = 0;
                  for (int k = 2; k < q.length; k += 2) {
                      float ax = cur.get(cur.size() - 2), ay = cur.get(cur.size() - 1);
                      float bx = q[k], by = q[k + 1];
                      float seg = (float) Math.hypot(bx - ax, by - ay);
                      while (seg > 0 && acc + seg > maxLen) {
                          float t = (maxLen - acc) / seg;
                          float mx = ax + (bx - ax) * t, my = ay + (by - ay) * t;
                          cur.add(mx);
                          cur.add(my);
                          out.add(toArr(cur));
                          cur = new ArrayList<>();
                          cur.add(mx);
                          cur.add(my);
                          ax = mx;
                          ay = my;
                          acc = 0;
                          seg = (float) Math.hypot(bx - ax, by - ay);
                      }
                      cur.add(bx);
                      cur.add(by);
                      acc += seg;
                  }
                  if (cur.size() >= 4) out.add(toArr(cur));
                  if (out.isEmpty()) out.add(q);
                  return out;
              }

              static float[] toArr(List<Float> l) {
                  float[] a = new float[l.size()];
                  for (int i = 0; i < a.length; i++) a[i] = l.get(i);
                  return a;
              }

              void finishDraw(String msg) {
                  drawing = false;
                  cancel = false;
                  setFab(okCount + "✓\n" + failCount + "✗", 11);
                  Toast.makeText(this, msg + "  (نجح " + okCount + " / فشل " + failCount + ")", Toast.LENGTH_LONG).show();
              }

              void drawNext(int i) {
                  try {
                      drawPiece(i);
                  } catch (Exception e) {
                      finishDraw("خطأ: " + e);
                  }
              }

              void drawPiece(int i) {
                  if (cancel) { finishDraw("تم الإيقاف"); return; }
                  if (plan == null || i >= plan.size()) { finishDraw("انتهى الرسم"); return; }
                  final Piece pc = plan.get(i);
                  setFab("⏹\n" + i + "/" + plan.size(), 11);
                  Path p = new Path();
                  p.moveTo(pc.pts[0], pc.pts[1]);
                  for (int k = 2; k < pc.pts.length; k += 2) p.lineTo(pc.pts[k], pc.pts[k + 1]);
                  GestureDescription gd = new GestureDescription.Builder()
                          .addStroke(new GestureDescription.StrokeDescription(p, 0, pc.dur))
                          .build();
                  GestureResultCallback cb = new GestureResultCallback() {
                      @Override public void onCompleted(GestureDescription g) {
                          okCount++;
                          h.postDelayed(() -> drawNext(i + 1), pc.pause);
                      }
                      @Override public void onCancelled(GestureDescription g) {
                          failCount++;
                          h.postDelayed(() -> drawNext(i + 1), pc.pause);
                      }
                  };
                  if (!dispatchGesture(gd, cb, null)) {
                      failCount++;
                      h.postDelayed(() -> drawNext(i + 1), pc.pause);
                  }
              }
          }
