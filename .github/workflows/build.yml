name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/autodraw app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoDraw"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.autodraw'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.autodraw'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.VIBRATE" />
              <application
                  android:label="رسام تلقائي"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".DrawService"
                      android:exported="true"
                      android:label="رسام تلقائي"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/desc"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="desc">يسمح لتطبيق الرسم التلقائي بتنفيذ حركات الرسم على الشاشة فقط.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/autodraw/Tracer.java <<'EOF'
          package com.autodraw;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;

          /** استخراج خطوط بدقة عالية مع الحفاظ على الخطوط وتكرار الداكن مرتين والرفيع مرة واحدة. */
          class Tracer {
              static class StrokeItem {
                  float[] pts;
                  int repeats; // 2 للأسود الداكن، 1 للخط الرفيع العادي

                  StrokeItem(float[] pts, int repeats) {
                      this.pts = pts;
                      this.repeats = Math.max(1, repeats);
                  }
              }

              static class Result {
                  List<float[]> strokes = new ArrayList<>();
                  List<StrokeItem> items = new ArrayList<>();
                  int w, h;
                  float totalLen;
                  int totalRepeats;
                  int fillCount;
                  float fillW;
              }

              static final int[] DX = {1, 1, 0, -1, -1, -1, 0, 1};
              static final int[] DY = {0, 1, 1, 1, 0, -1, -1, -1};
              static final int GAP = 5;

              static class IL {
                  int[] a = new int[64];
                  int n;
                  void add(int v) {
                      if (n == a.length) a = Arrays.copyOf(a, n * 2);
                      a[n++] = v;
                  }
              }

              static Result trace(int[] argb, int w, int h, int detail, boolean fill) {
                  int n = w * h;
                  float d = detail / 100f;
                  Result res = new Result();
                  res.w = w;
                  res.h = h;

                  // 1) رمادي (الشفافية فوق خلفية بيضاء)
                  float[] gray = new float[n];
                  for (int i = 0; i < n; i++) {
                      int c = argb[i];
                      float a = ((c >>> 24) & 255) / 255f;
                      float r = ((c >> 16) & 255) * a + 255f * (1 - a);
                      float g = ((c >> 8) & 255) * a + 255f * (1 - a);
                      float b = (c & 255) * a + 255f * (1 - a);
                      gray[i] = 0.299f * r + 0.587f * g + 0.114f * b;
                  }

                  // 2) تنعيم غاوسي خفيف جداً للحفاظ على الخطوط الرفيعة دون ضياع
                  float[] bl = blur(gray, w, h, 1.15f - 0.55f * d);

                  // 3) Sobel
                  float[] gx = new float[n], gy = new float[n], mag = new float[n];
                  float maxMag = 0;
                  for (int y = 1; y < h - 1; y++) {
                      for (int x = 1; x < w - 1; x++) {
                          int i = y * w + x;
                          float sx = -bl[i - w - 1] - 2 * bl[i - 1] - bl[i + w - 1] + bl[i - w + 1] + 2 * bl[i + 1] + bl[i + w + 1];
                          float sy = -bl[i - w - 1] - 2 * bl[i - w] - bl[i - w + 1] + bl[i + w - 1] + 2 * bl[i + w] + bl[i + w + 1];
                          gx[i] = sx;
                          gy[i] = sy;
                          float m = (float) Math.sqrt(sx * sx + sy * sy);
                          mag[i] = m;
                          if (m > maxMag) maxMag = m;
                      }
                  }
                  if (maxMag <= 0) return res;

                  // عتبات حساسة لعدم ترك الخطوط الخفيفة أو الداكنة
                  int[] hist = new int[1024];
                  for (int i = 0; i < n; i++) hist[Math.min(1023, (int) (mag[i] / maxMag * 1023))]++;
                  long target = (long) (n * 0.99f), acc = 0;
                  int bin = 0;
                  for (; bin < 1024; bin++) {
                      acc += hist[bin];
                      if (acc >= target) break;
                  }
                  float pv = (Math.min(bin, 1023) + 1) / 1024f * maxMag;
                  float high = Math.max(8f, pv * (0.36f - 0.25f * d));
                  float low = high * 0.35f;

                  // 4) NMS + hysteresis
                  boolean[] cand = new boolean[n];
                  boolean[] edge = new boolean[n];
                  int[] stack = new int[n];
                  int sp = 0;
                  for (int y = 1; y < h - 1; y++) {
                      for (int x = 1; x < w - 1; x++) {
                          int i = y * w + x;
                          float m = mag[i];
                          if (m < low) continue;
                          float ax = Math.abs(gx[i]), ay = Math.abs(gy[i]);
                          float m1, m2;
                          if (ay <= 0.4142f * ax) { m1 = mag[i - 1]; m2 = mag[i + 1]; }
                          else if (ay >= 2.4142f * ax) { m1 = mag[i - w]; m2 = mag[i + w]; }
                          else if ((gx[i] > 0) == (gy[i] > 0)) { m1 = mag[i - w - 1]; m2 = mag[i + w + 1]; }
                          else { m1 = mag[i - w + 1]; m2 = mag[i + w - 1]; }
                          if (m >= m1 && m > m2) {
                              cand[i] = true;
                              if (m >= high) { edge[i] = true; stack[sp++] = i; }
                          }
                      }
                  }
                  while (sp > 0) {
                      int i = stack[--sp];
                      int x = i % w, y = i / w;
                      for (int k = 0; k < 8; k++) {
                          int nx = x + DX[k], ny = y + DY[k];
                          if (nx < 1 || ny < 1 || nx >= w - 1 || ny >= h - 1) continue;
                          int ni = ny * w + nx;
                          if (cand[ni] && !edge[ni]) { edge[ni] = true; stack[sp++] = ni; }
                      }
                  }

                  // 5) تنحيف إلى بكسل واحد
                  thin(edge, w, h);

                  // 6) تتبع الخطوط: نبدأ من الأطراف ثم الحلقات
                  boolean[] used = new boolean[n];
                  List<IL> raw = new ArrayList<>();
                  for (int pass = 0; pass < 2; pass++) {
                      for (int y = 1; y < h - 1; y++) {
                          for (int x = 1; x < w - 1; x++) {
                              int i = y * w + x;
                              if (!edge[i] || used[i]) continue;
                              if (pass == 0 && freeNeighbors(edge, used, x, y, w, h) != 1) continue;
                              raw.add(traceFrom(x, y, edge, used, w, h));
                          }
                      }
                  }

                  // 7) الاحتفاظ بالخطوط دون حذف الخطوط الصغيرة المهمة
                  int minLen = Math.max(2, (int) (3 + (100 - detail) * 0.05f));
                  List<float[]> strokes = new ArrayList<>();
                  for (IL p : raw) {
                      int cnt = p.n / 2;
                      if (cnt < minLen) continue;
                      float[] s = simplify(p, 0.55f);
                      if (s.length < 4) continue;
                      strokes.add(s);
                  }

                  // 7ب) تعبئة المساحات السوداء والظلال كما هي عند التفعيل
                  int fsp = Math.max(2, Math.round(5f - 2.5f * d));
                  List<float[]> fills = new ArrayList<>();
                  if (fill) fills = fillStrokes(bl, w, h, fsp);
                  if (strokes.isEmpty() && fills.isEmpty()) return res;

                  // حساب الحدود وقص الهوامش الفارغة
                  float[] bb = {1e9f, 1e9f, -1e9f, -1e9f};
                  grow(strokes, bb);
                  grow(fills, bb);
                  shift(strokes, bb[0], bb[1]);
                  shift(fills, bb[0], bb[1]);
                  res.w = (int) Math.ceil(bb[2] - bb[0]) + 1;
                  res.h = (int) Math.ceil(bb[3] - bb[1]) + 1;

                  // ترتيب متسلسل طبيعي دون قفز عشوائي بعيد
                  List<float[]> orderedFills = sequentialOrder(fills);
                  List<float[]> orderedStrokes = sequentialOrder(strokes);

                  List<float[]> all = new ArrayList<>(orderedFills);
                  all.addAll(orderedStrokes);
                  res.fillCount = orderedFills.size();
                  res.fillW = fsp;
                  res.strokes = all;

                  List<StrokeItem> items = new ArrayList<>();
                  float total = 0;
                  int repsSum = 0;

                  // خطوط التعبئة تُرسم مرة واحدة لتجنب التراكم المفرط
                  for (float[] s : orderedFills) {
                      items.add(new StrokeItem(s, 1));
                      repsSum += 1;
                      for (int k = 2; k < s.length; k += 2) {
                          total += (float) Math.hypot(s[k] - s[k - 2], s[k + 1] - s[k - 1]);
                      }
                  }

                  // الخطوط المستخرجة: الداكنة مرتين، والرفيعة العادية مرة واحدة
                  for (float[] s : orderedStrokes) {
                      int reps = isDarkLine(s, gray, w, h, bb[0], bb[1]) ? 2 : 1;
                      items.add(new StrokeItem(s, reps));
                      repsSum += reps;
                      float slen = 0;
                      for (int k = 2; k < s.length; k += 2) {
                          slen += (float) Math.hypot(s[k] - s[k - 2], s[k + 1] - s[k - 1]);
                      }
                      total += slen * reps;
                  }

                  res.items = items;
                  res.totalLen = total;
                  res.totalRepeats = repsSum;
                  return res;
              }

              /** يحدد هل الخط أسود داكن (يتكرر مرتين) أم خط رفيع عادي (يتكرر مرة واحدة) */
              static boolean isDarkLine(float[] pts, float[] gray, int w, int h, float offX, float offY) {
                  if (pts == null || pts.length < 4 || gray == null || w <= 0 || h <= 0) return false;
                  float sum = 0;
                  int count = 0;
                  for (int k = 0; k < pts.length; k += 2) {
                      int x = Math.max(0, Math.min(w - 1, Math.round(pts[k] + offX)));
                      int y = Math.max(0, Math.min(h - 1, Math.round(pts[k + 1] + offY)));
                      sum += gray[y * w + x];
                      count++;
                  }
                  if (count == 0) return false;
                  float avgGray = sum / count;
                  return avgGray < 120f;
              }

              static void grow(List<float[]> list, float[] bb) {
                  for (float[] s : list) {
                      for (int k = 0; k < s.length; k += 2) {
                          bb[0] = Math.min(bb[0], s[k]); bb[2] = Math.max(bb[2], s[k]);
                          bb[1] = Math.min(bb[1], s[k + 1]); bb[3] = Math.max(bb[3], s[k + 1]);
                      }
                  }
              }

              static void shift(List<float[]> list, float dx, float dy) {
                  for (float[] s : list) {
                      for (int k = 0; k < s.length; k += 2) { s[k] -= dx; s[k + 1] -= dy; }
                  }
              }

              static int otsu(float[] g, int n) {
                  int[] hs = new int[256];
                  for (int i = 0; i < n; i++) hs[Math.max(0, Math.min(255, (int) g[i]))]++;
                  long sumAll = 0;
                  for (int i = 0; i < 256; i++) sumAll += (long) i * hs[i];
                  long wB = 0, sumB = 0;
                  double best = -1;
                  int th = 128;
                  for (int t = 0; t < 256; t++) {
                      wB += hs[t];
                      if (wB == 0) continue;
                      long wF = n - wB;
                      if (wF == 0) break;
                      sumB += (long) t * hs[t];
                      double mB = (double) sumB / wB, mF = (double) (sumAll - sumB) / wF;
                      double v = (double) wB * wF * (mB - mF) * (mB - mF);
                      if (v > best) { best = v; th = t; }
                  }
                  return th;
              }

              static boolean[] erode(boolean[] m, int w, int h, int r) {
                  boolean[] a = new boolean[w * h], b = new boolean[w * h];
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          boolean ok = true;
                          for (int i = -r; i <= r && ok; i++) {
                              int xx = Math.min(w - 1, Math.max(0, x + i));
                              if (!m[y * w + xx]) ok = false;
                          }
                          a[y * w + x] = ok;
                      }
                  }
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          boolean ok = true;
                          for (int i = -r; i <= r && ok; i++) {
                              int yy = Math.min(h - 1, Math.max(0, y + i));
                              if (!a[yy * w + x]) ok = false;
                          }
                          b[y * w + x] = ok;
                      }
                  }
                  return b;
              }

              static List<float[]> fillStrokes(float[] g, int w, int h, int sp) {
                  int n = w * h;
                  int t = otsu(g, n);
                  float darkT = Math.max(45f, Math.min(120f, t * 0.85f));
                  float midT = Math.max(100f, Math.min(185f, t * 1.25f));
                  boolean[] dark = new boolean[n], mid = new boolean[n];
                  for (int i = 0; i < n; i++) {
                      if (g[i] < darkT) dark[i] = true;
                      else if (g[i] < midT) mid[i] = true;
                  }
                  dark = erode(dark, w, h, 1);
                  mid = erode(mid, w, h, 3);
                  List<float[]> out = new ArrayList<>();
                  hatch(dark, w, h, sp, sp / 2, out);
                  hatch(mid, w, h, sp * 3, sp, out);
                  return out;
              }

              static void hatch(boolean[] m, int w, int h, int sp, int off, List<float[]> out) {
                  List<List<int[]>> rows = new ArrayList<>();
                  for (int y = off; y < h - 1; y += sp) {
                      List<int[]> rr = new ArrayList<>();
                      int x = 0;
                      while (x < w) {
                          if (!m[y * w + x]) { x++; continue; }
                          int x0 = x;
                          while (x < w && m[y * w + x]) x++;
                          if (x - x0 >= 3) rr.add(new int[]{x0, x - 1, y, 0});
                      }
                      rows.add(rr);
                  }
                  int lim = 2 * sp + 3;
                  for (int r = 0; r < rows.size(); r++) {
                      for (int[] run : rows.get(r)) {
                          if (run[3] == 1) continue;
                          run[3] = 1;
                          IL p = new IL();
                          p.add(run[0]); p.add(run[2]); p.add(run[1]); p.add(run[2]);
                          int endX = run[1];
                          int[] cur = run;
                          int rr = r, steps = 0;
                          while (rr + 1 < rows.size() && steps < 60) {
                              int[] best = null;
                              int bd = Integer.MAX_VALUE;
                              boolean fromLeft = true;
                              for (int[] c : rows.get(rr + 1)) {
                                  if (c[3] == 1) continue;
                                  if (c[1] < cur[0] || c[0] > cur[1]) continue;
                                  int dl = Math.abs(c[0] - endX), dr = Math.abs(c[1] - endX);
                                  int dd = Math.min(dl, dr);
                                  if (dd < bd) { bd = dd; best = c; fromLeft = dl <= dr; }
                              }
                              if (best == null || bd > lim) break;
                              best[3] = 1;
                              if (fromLeft) {
                                  p.add(best[0]); p.add(best[2]); p.add(best[1]); p.add(best[2]);
                                  endX = best[1];
                              } else {
                                  p.add(best[1]); p.add(best[2]); p.add(best[0]); p.add(best[2]);
                                  endX = best[0];
                              }
                              cur = best;
                              rr++;
                              steps++;
                          }
                          float[] s = new float[p.n];
                          for (int k = 0; k < p.n; k++) s[k] = p.a[k];
                          out.add(s);
                      }
                  }
              }

              static float[] blur(float[] src, int w, int h, float sigma) {
                  if (sigma <= 0.1f) return src.clone();
                  int r = Math.max(1, (int) Math.ceil(sigma * 2.5f));
                  float[] k = new float[2 * r + 1];
                  float sum = 0;
                  for (int i = -r; i <= r; i++) {
                      k[i + r] = (float) Math.exp(-(i * i) / (2 * sigma * sigma));
                      sum += k[i + r];
                  }
                  for (int i = 0; i < k.length; i++) k[i] /= sum;
                  float[] tmp = new float[w * h], out = new float[w * h];
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          float s = 0;
                          for (int i = -r; i <= r; i++) {
                              int xx = Math.min(w - 1, Math.max(0, x + i));
                              s += src[y * w + xx] * k[i + r];
                          }
                          tmp[y * w + x] = s;
                      }
                  }
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          float s = 0;
                          for (int i = -r; i <= r; i++) {
                              int yy = Math.min(h - 1, Math.max(0, y + i));
                              s += tmp[yy * w + x] * k[i + r];
                          }
                          out[y * w + x] = s;
                      }
                  }
                  return out;
              }

              static void thin(boolean[] im, int w, int h) {
                  int[] buf = new int[w * h];
                  boolean changed;
                  do {
                      changed = false;
                      for (int step = 0; step < 2; step++) {
                          int cnt = 0;
                          for (int y = 1; y < h - 1; y++) {
                              for (int x = 1; x < w - 1; x++) {
                                  int i = y * w + x;
                                  if (!im[i]) continue;
                                  boolean p2 = im[i - w], p3 = im[i - w + 1], p4 = im[i + 1], p5 = im[i + w + 1];
                                  boolean p6 = im[i + w], p7 = im[i + w - 1], p8 = im[i - 1], p9 = im[i - w - 1];
                                  int b = (p2 ? 1 : 0) + (p3 ? 1 : 0) + (p4 ? 1 : 0) + (p5 ? 1 : 0)
                                          + (p6 ? 1 : 0) + (p7 ? 1 : 0) + (p8 ? 1 : 0) + (p9 ? 1 : 0);
                                  if (b < 2 || b > 6) continue;
                                  int a = 0;
                                  if (!p2 && p3) a++;
                                  if (!p3 && p4) a++;
                                  if (!p4 && p5) a++;
                                  if (!p5 && p6) a++;
                                  if (!p6 && p7) a++;
                                  if (!p7 && p8) a++;
                                  if (!p8 && p9) a++;
                                  if (!p9 && p2) a++;
                                  if (a != 1) continue;
                                  if (step == 0) {
                                      if (p2 && p4 && p6) continue;
                                      if (p4 && p6 && p8) continue;
                                  } else {
                                      if (p2 && p4 && p8) continue;
                                      if (p2 && p6 && p8) continue;
                                  }
                                  buf[cnt++] = i;
                              }
                          }
                          for (int k = 0; k < cnt; k++) im[buf[k]] = false;
                          if (cnt > 0) changed = true;
                      }
                  } while (changed);
              }

              static int freeNeighbors(boolean[] edge, boolean[] used, int x, int y, int w, int h) {
                  int c = 0;
                  for (int k = 0; k < 8; k++) {
                      int nx = x + DX[k], ny = y + DY[k];
                      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                      int ni = ny * w + nx;
                      if (edge[ni] && !used[ni]) c++;
                  }
                  return c;
              }

              static IL traceFrom(int sx, int sy, boolean[] edge, boolean[] used, int w, int h) {
                  used[sy * w + sx] = true;
                  IL f = new IL();
                  f.add(sx); f.add(sy);
                  extend(f, edge, used, w, h);
                  IL b = new IL();
                  b.add(sx); b.add(sy);
                  extend(b, edge, used, w, h);
                  IL out = new IL();
                  for (int k = b.n / 2 - 1; k >= 1; k--) { out.add(b.a[2 * k]); out.add(b.a[2 * k + 1]); }
                  for (int k = 0; k < f.n / 2; k++) { out.add(f.a[2 * k]); out.add(f.a[2 * k + 1]); }
                  int cnt = out.n / 2;
                  if (cnt > 10) {
                      int fx = out.a[0], fy = out.a[1], lx = out.a[out.n - 2], ly = out.a[out.n - 1];
                      double dist = Math.hypot(fx - lx, fy - ly);
                      if (dist > 0 && dist <= 2.5) { out.add(fx); out.add(fy); }
                  }
                  return out;
              }

              static void extend(IL p, boolean[] edge, boolean[] used, int w, int h) {
                  while (true) {
                      int k = p.n / 2;
                      int cx = p.a[2 * k - 2], cy = p.a[2 * k - 1];
                      float vx = 0, vy = 0;
                      if (k >= 2) {
                          int b = Math.max(0, k - 7);
                          vx = cx - p.a[2 * b];
                          vy = cy - p.a[2 * b + 1];
                          float l = (float) Math.sqrt(vx * vx + vy * vy);
                          if (l > 0) { vx /= l; vy /= l; }
                      }
                      int best = -1;
                      float bs = -9;
                      for (int d = 0; d < 8; d++) {
                          int nx = cx + DX[d], ny = cy + DY[d];
                          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                          int ni = ny * w + nx;
                          if (!edge[ni] || used[ni]) continue;
                          float sc;
                          if (k < 2) sc = (d % 2 == 0) ? 1f : 0.9f;
                          else {
                              float l = (d % 2 == 0) ? 1f : 1.4142f;
                              sc = (DX[d] * vx + DY[d] * vy) / l;
                          }
                          if (sc > bs) { bs = sc; best = d; }
                      }
                      if (best >= 0) {
                          int nx = cx + DX[best], ny = cy + DY[best];
                          used[ny * w + nx] = true;
                          p.add(nx); p.add(ny);
                          continue;
                      }
                      if (k < 2) break;
                      int bx = -1, by = -1;
                      float bscore = 1e9f;
                      for (int dy = -GAP; dy <= GAP; dy++) {
                          for (int dx = -GAP; dx <= GAP; dx++) {
                              float dist = (float) Math.sqrt(dx * dx + dy * dy);
                              if (dist < 1.5f || dist > GAP) continue;
                              int nx = cx + dx, ny = cy + dy;
                              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                              int ni = ny * w + nx;
                              if (!edge[ni] || used[ni]) continue;
                              float dot = (dx * vx + dy * vy) / dist;
                              if (dot < 0.55f) continue;
                              float score = dist - dot;
                              if (score < bscore) { bscore = score; bx = nx; by = ny; }
                          }
                      }
                      if (bx < 0) break;
                      used[by * w + bx] = true;
                      p.add(bx); p.add(by);
                  }
              }

              static float[] simplify(IL p, float eps) {
                  int n = p.n / 2;
                  boolean[] keep = new boolean[n];
                  keep[0] = true;
                  keep[n - 1] = true;
                  ArrayDeque<int[]> st = new ArrayDeque<>();
                  st.push(new int[]{0, n - 1});
                  while (!st.isEmpty()) {
                      int[] r = st.pop();
                      int a = r[0], b = r[1];
                      if (b <= a + 1) continue;
                      float ax = p.a[2 * a], ay = p.a[2 * a + 1], bx = p.a[2 * b], by = p.a[2 * b + 1];
                      float dx = bx - ax, dy = by - ay;
                      float len = (float) Math.sqrt(dx * dx + dy * dy);
                      float md = -1;
                      int mi = -1;
                      for (int i = a + 1; i < b; i++) {
                          float px = p.a[2 * i], py = p.a[2 * i + 1];
                          float dd;
                          if (len == 0) dd = (float) Math.hypot(px - ax, py - ay);
                          else dd = Math.abs(dy * px - dx * py + bx * ay - by * ax) / len;
                          if (dd > md) { md = dd; mi = i; }
                      }
                      if (md > eps) {
                          keep[mi] = true;
                          st.push(new int[]{a, mi});
                          st.push(new int[]{mi, b});
                      }
                  }
                  int c = 0;
                  for (boolean k : keep) if (k) c++;
                  float[] out = new float[c * 2];
                  int j = 0;
                  for (int i = 0; i < n; i++) {
                      if (keep[i]) { out[j++] = p.a[2 * i]; out[j++] = p.a[2 * i + 1]; }
                  }
                  return out;
              }

              /** ترتيب متسلسل دون قفزات عشوائية بعيدة */
              static List<float[]> sequentialOrder(List<float[]> in) {
                  List<float[]> rest = new ArrayList<>(in);
                  List<float[]> out = new ArrayList<>();
                  float cx = 0, cy = 0;
                  while (!rest.isEmpty()) {
                      int bi = 0;
                      boolean rev = false;
                      float bd = 1e18f;
                      for (int i = 0; i < rest.size(); i++) {
                          float[] s = rest.get(i);
                          float d1 = (s[0] - cx) * (s[0] - cx) + (s[1] - cy) * (s[1] - cy);
                          float ex = s[s.length - 2], ey = s[s.length - 1];
                          float d2 = (ex - cx) * (ex - cx) + (ey - cy) * (ey - cy);
                          if (d1 < bd) { bd = d1; bi = i; rev = false; }
                          if (d2 < bd) { bd = d2; bi = i; rev = true; }
                      }
                      float[] s = rest.remove(bi);
                      if (rev) {
                          float[] r = new float[s.length];
                          for (int k = 0; k < s.length; k += 2) {
                              r[k] = s[s.length - 2 - k];
                              r[k + 1] = s[s.length - 1 - k];
                          }
                          s = r;
                      }
                      out.add(s);
                      cx = s[s.length - 2];
                      cy = s[s.length - 1];
                  }
                  return out;
              }
          }
