name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/autodraw app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoDraw"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.autodraw'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.autodraw'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="رسام تلقائي"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".DrawService"
                      android:exported="true"
                      android:label="رسام تلقائي"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/desc"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="desc">يسمح لتطبيق الرسم التلقائي بتنفيذ حركات الرسم على الشاشة فقط.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/autodraw/Tracer.java <<'EOF'
          package com.autodraw;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;

          /** استخراج خطوط نظيفة من صورة: Canny + تنحيف + تتبع مستمر للخطوط. بدون أي اعتماد على أندرويد. */
          class Tracer {
              static class Result {
                  List<float[]> strokes = new ArrayList<>();
                  int w, h;
                  float totalLen;
              }

              static final int[] DX = {1, 1, 0, -1, -1, -1, 0, 1};
              static final int[] DY = {0, 1, 1, 1, 0, -1, -1, -1};
              static final int GAP = 4;

              static class IL {
                  int[] a = new int[64];
                  int n;
                  void add(int v) {
                      if (n == a.length) a = Arrays.copyOf(a, n * 2);
                      a[n++] = v;
                  }
              }

              static Result trace(int[] argb, int w, int h, int detail) {
                  int n = w * h;
                  float d = detail / 100f;
                  Result res = new Result();
                  res.w = w;
                  res.h = h;

                  // 1) رمادي (الشفافية فوق خلفية بيضاء)
                  float[] gray = new float[n];
                  for (int i = 0; i < n; i++) {
                      int c = argb[i];
                      float a = ((c >>> 24) & 255) / 255f;
                      float r = ((c >> 16) & 255) * a + 255f * (1 - a);
                      float g = ((c >> 8) & 255) * a + 255f * (1 - a);
                      float b = (c & 255) * a + 255f * (1 - a);
                      gray[i] = 0.299f * r + 0.587f * g + 0.114f * b;
                  }

                  // 2) تنعيم غاوسي (تفاصيل أقل = تنعيم أكبر)
                  float[] bl = blur(gray, w, h, 2.0f - 1.0f * d);

                  // 3) Sobel
                  float[] gx = new float[n], gy = new float[n], mag = new float[n];
                  float maxMag = 0;
                  for (int y = 1; y < h - 1; y++) {
                      for (int x = 1; x < w - 1; x++) {
                          int i = y * w + x;
                          float sx = -bl[i - w - 1] - 2 * bl[i - 1] - bl[i + w - 1] + bl[i - w + 1] + 2 * bl[i + 1] + bl[i + w + 1];
                          float sy = -bl[i - w - 1] - 2 * bl[i - w] - bl[i - w + 1] + bl[i + w - 1] + 2 * bl[i + w] + bl[i + w + 1];
                          gx[i] = sx;
                          gy[i] = sy;
                          float m = (float) Math.sqrt(sx * sx + sy * sy);
                          mag[i] = m;
                          if (m > maxMag) maxMag = m;
                      }
                  }
                  if (maxMag <= 0) return res;

                  // عتبات تلقائية من توزيع قوة الحواف
                  int[] hist = new int[1024];
                  for (int i = 0; i < n; i++) hist[Math.min(1023, (int) (mag[i] / maxMag * 1023))]++;
                  long target = (long) (n * 0.985), acc = 0;
                  int bin = 0;
                  for (; bin < 1024; bin++) {
                      acc += hist[bin];
                      if (acc >= target) break;
                  }
                  float pv = (Math.min(bin, 1023) + 1) / 1024f * maxMag;
                  float high = pv * (0.55f - 0.42f * d);
                  float low = high * 0.4f;

                  // 4) NMS + hysteresis
                  boolean[] cand = new boolean[n];
                  boolean[] edge = new boolean[n];
                  int[] stack = new int[n];
                  int sp = 0;
                  for (int y = 1; y < h - 1; y++) {
                      for (int x = 1; x < w - 1; x++) {
                          int i = y * w + x;
                          float m = mag[i];
                          if (m < low) continue;
                          float ax = Math.abs(gx[i]), ay = Math.abs(gy[i]);
                          float m1, m2;
                          if (ay <= 0.4142f * ax) { m1 = mag[i - 1]; m2 = mag[i + 1]; }
                          else if (ay >= 2.4142f * ax) { m1 = mag[i - w]; m2 = mag[i + w]; }
                          else if ((gx[i] > 0) == (gy[i] > 0)) { m1 = mag[i - w - 1]; m2 = mag[i + w + 1]; }
                          else { m1 = mag[i - w + 1]; m2 = mag[i + w - 1]; }
                          if (m >= m1 && m > m2) {
                              cand[i] = true;
                              if (m >= high) { edge[i] = true; stack[sp++] = i; }
                          }
                      }
                  }
                  while (sp > 0) {
                      int i = stack[--sp];
                      int x = i % w, y = i / w;
                      for (int k = 0; k < 8; k++) {
                          int nx = x + DX[k], ny = y + DY[k];
                          if (nx < 1 || ny < 1 || nx >= w - 1 || ny >= h - 1) continue;
                          int ni = ny * w + nx;
                          if (cand[ni] && !edge[ni]) { edge[ni] = true; stack[sp++] = ni; }
                      }
                  }

                  // 5) تنحيف إلى بكسل واحد
                  thin(edge, w, h);

                  // 6) تتبع الخطوط: نبدأ من الأطراف ثم الحلقات
                  boolean[] used = new boolean[n];
                  List<IL> raw = new ArrayList<>();
                  for (int pass = 0; pass < 2; pass++) {
                      for (int y = 1; y < h - 1; y++) {
                          for (int x = 1; x < w - 1; x++) {
                              int i = y * w + x;
                              if (!edge[i] || used[i]) continue;
                              if (pass == 0 && freeNeighbors(edge, used, x, y, w, h) != 1) continue;
                              raw.add(traceFrom(x, y, edge, used, w, h));
                          }
                      }
                  }

                  // 7) تصفية القصير + تبسيط + حساب الحدود
                  int minLen = (int) (8 + (100 - detail) * 0.35f);
                  List<float[]> strokes = new ArrayList<>();
                  float minX = 1e9f, minY = 1e9f, maxX = -1e9f, maxY = -1e9f;
                  for (IL p : raw) {
                      int cnt = p.n / 2;
                      if (cnt < minLen) continue;
                      float[] s = simplify(p, 0.9f);
                      if (s.length < 4) continue;
                      for (int k = 0; k < s.length; k += 2) {
                          minX = Math.min(minX, s[k]); maxX = Math.max(maxX, s[k]);
                          minY = Math.min(minY, s[k + 1]); maxY = Math.max(maxY, s[k + 1]);
                      }
                      strokes.add(s);
                  }
                  if (strokes.isEmpty()) return res;

                  // قص الهوامش الفارغة: الرسم يملأ اللوحة بأكبر حجم ممكن
                  for (float[] s : strokes) {
                      for (int k = 0; k < s.length; k += 2) { s[k] -= minX; s[k + 1] -= minY; }
                  }
                  res.w = (int) Math.ceil(maxX - minX) + 1;
                  res.h = (int) Math.ceil(maxY - minY) + 1;

                  // 8) ترتيب الخطوط بالأقرب فالأقرب
                  res.strokes = order(strokes);
                  float total = 0;
                  for (float[] s : res.strokes) {
                      for (int k = 2; k < s.length; k += 2) {
                          total += (float) Math.hypot(s[k] - s[k - 2], s[k + 1] - s[k - 1]);
                      }
                  }
                  res.totalLen = total;
                  return res;
              }

              static float[] blur(float[] src, int w, int h, float sigma) {
                  int r = Math.max(1, (int) Math.ceil(sigma * 2.5f));
                  float[] k = new float[2 * r + 1];
                  float sum = 0;
                  for (int i = -r; i <= r; i++) {
                      k[i + r] = (float) Math.exp(-(i * i) / (2 * sigma * sigma));
                      sum += k[i + r];
                  }
                  for (int i = 0; i < k.length; i++) k[i] /= sum;
                  float[] tmp = new float[w * h], out = new float[w * h];
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          float s = 0;
                          for (int i = -r; i <= r; i++) {
                              int xx = Math.min(w - 1, Math.max(0, x + i));
                              s += src[y * w + xx] * k[i + r];
                          }
                          tmp[y * w + x] = s;
                      }
                  }
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          float s = 0;
                          for (int i = -r; i <= r; i++) {
                              int yy = Math.min(h - 1, Math.max(0, y + i));
                              s += tmp[yy * w + x] * k[i + r];
                          }
                          out[y * w + x] = s;
                      }
                  }
                  return out;
              }

              /** Zhang-Suen */
              static void thin(boolean[] im, int w, int h) {
                  int[] buf = new int[w * h];
                  boolean changed;
                  do {
                      changed = false;
                      for (int step = 0; step < 2; step++) {
                          int cnt = 0;
                          for (int y = 1; y < h - 1; y++) {
                              for (int x = 1; x < w - 1; x++) {
                                  int i = y * w + x;
                                  if (!im[i]) continue;
                                  boolean p2 = im[i - w], p3 = im[i - w + 1], p4 = im[i + 1], p5 = im[i + w + 1];
                                  boolean p6 = im[i + w], p7 = im[i + w - 1], p8 = im[i - 1], p9 = im[i - w - 1];
                                  int b = (p2 ? 1 : 0) + (p3 ? 1 : 0) + (p4 ? 1 : 0) + (p5 ? 1 : 0)
                                          + (p6 ? 1 : 0) + (p7 ? 1 : 0) + (p8 ? 1 : 0) + (p9 ? 1 : 0);
                                  if (b < 2 || b > 6) continue;
                                  int a = 0;
                                  if (!p2 && p3) a++;
                                  if (!p3 && p4) a++;
                                  if (!p4 && p5) a++;
                                  if (!p5 && p6) a++;
                                  if (!p6 && p7) a++;
                                  if (!p7 && p8) a++;
                                  if (!p8 && p9) a++;
                                  if (!p9 && p2) a++;
                                  if (a != 1) continue;
                                  if (step == 0) {
                                      if (p2 && p4 && p6) continue;
                                      if (p4 && p6 && p8) continue;
                                  } else {
                                      if (p2 && p4 && p8) continue;
                                      if (p2 && p6 && p8) continue;
                                  }
                                  buf[cnt++] = i;
                              }
                          }
                          for (int k = 0; k < cnt; k++) im[buf[k]] = false;
                          if (cnt > 0) changed = true;
                      }
                  } while (changed);
              }

              static int freeNeighbors(boolean[] edge, boolean[] used, int x, int y, int w, int h) {
                  int c = 0;
                  for (int k = 0; k < 8; k++) {
                      int nx = x + DX[k], ny = y + DY[k];
                      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                      int ni = ny * w + nx;
                      if (edge[ni] && !used[ni]) c++;
                  }
                  return c;
              }

              static IL traceFrom(int sx, int sy, boolean[] edge, boolean[] used, int w, int h) {
                  used[sy * w + sx] = true;
                  IL f = new IL();
                  f.add(sx); f.add(sy);
                  extend(f, edge, used, w, h);
                  IL b = new IL();
                  b.add(sx); b.add(sy);
                  extend(b, edge, used, w, h);
                  IL out = new IL();
                  for (int k = b.n / 2 - 1; k >= 1; k--) { out.add(b.a[2 * k]); out.add(b.a[2 * k + 1]); }
                  for (int k = 0; k < f.n / 2; k++) { out.add(f.a[2 * k]); out.add(f.a[2 * k + 1]); }
                  int cnt = out.n / 2;
                  if (cnt > 10) {
                      int fx = out.a[0], fy = out.a[1], lx = out.a[out.n - 2], ly = out.a[out.n - 1];
                      double dist = Math.hypot(fx - lx, fy - ly);
                      if (dist > 0 && dist <= 2.5) { out.add(fx); out.add(fy); }
                  }
                  return out;
              }

              static void extend(IL p, boolean[] edge, boolean[] used, int w, int h) {
                  while (true) {
                      int k = p.n / 2;
                      int cx = p.a[2 * k - 2], cy = p.a[2 * k - 1];
                      float vx = 0, vy = 0;
                      if (k >= 2) {
                          int b = Math.max(0, k - 7);
                          vx = cx - p.a[2 * b];
                          vy = cy - p.a[2 * b + 1];
                          float l = (float) Math.sqrt(vx * vx + vy * vy);
                          if (l > 0) { vx /= l; vy /= l; }
                      }
                      int best = -1;
                      float bs = -9;
                      for (int d = 0; d < 8; d++) {
                          int nx = cx + DX[d], ny = cy + DY[d];
                          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                          int ni = ny * w + nx;
                          if (!edge[ni] || used[ni]) continue;
                          float sc;
                          if (k < 2) sc = (d % 2 == 0) ? 1f : 0.9f;
                          else {
                              float l = (d % 2 == 0) ? 1f : 1.4142f;
                              sc = (DX[d] * vx + DY[d] * vy) / l;
                          }
                          if (sc > bs) { bs = sc; best = d; }
                      }
                      if (best >= 0) {
                          int nx = cx + DX[best], ny = cy + DY[best];
                          used[ny * w + nx] = true;
                          p.add(nx); p.add(ny);
                          continue;
                      }
                      if (k < 2) break;
                      // سدّ فجوة صغيرة بالاتجاه الأمامي
                      int bx = -1, by = -1;
                      float bscore = 1e9f;
                      for (int dy = -GAP; dy <= GAP; dy++) {
                          for (int dx = -GAP; dx <= GAP; dx++) {
                              float dist = (float) Math.sqrt(dx * dx + dy * dy);
                              if (dist < 1.5f || dist > GAP) continue;
                              int nx = cx + dx, ny = cy + dy;
                              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                              int ni = ny * w + nx;
                              if (!edge[ni] || used[ni]) continue;
                              float dot = (dx * vx + dy * vy) / dist;
                              if (dot < 0.6f) continue;
                              float score = dist - dot;
                              if (score < bscore) { bscore = score; bx = nx; by = ny; }
                          }
                      }
                      if (bx < 0) break;
                      used[by * w + bx] = true;
                      p.add(bx); p.add(by);
                  }
              }

              /** Douglas-Peucker */
              static float[] simplify(IL p, float eps) {
                  int n = p.n / 2;
                  boolean[] keep = new boolean[n];
                  keep[0] = true;
                  keep[n - 1] = true;
                  ArrayDeque<int[]> st = new ArrayDeque<>();
                  st.push(new int[]{0, n - 1});
                  while (!st.isEmpty()) {
                      int[] r = st.pop();
                      int a = r[0], b = r[1];
                      if (b <= a + 1) continue;
                      float ax = p.a[2 * a], ay = p.a[2 * a + 1], bx = p.a[2 * b], by = p.a[2 * b + 1];
                      float dx = bx - ax, dy = by - ay;
                      float len = (float) Math.sqrt(dx * dx + dy * dy);
                      float md = -1;
                      int mi = -1;
                      for (int i = a + 1; i < b; i++) {
                          float px = p.a[2 * i], py = p.a[2 * i + 1];
                          float dd;
                          if (len == 0) dd = (float) Math.hypot(px - ax, py - ay);
                          else dd = Math.abs(dy * px - dx * py + bx * ay - by * ax) / len;
                          if (dd > md) { md = dd; mi = i; }
                      }
                      if (md > eps) {
                          keep[mi] = true;
                          st.push(new int[]{a, mi});
                          st.push(new int[]{mi, b});
                      }
                  }
                  int c = 0;
                  for (boolean k : keep) if (k) c++;
                  float[] out = new float[c * 2];
                  int j = 0;
                  for (int i = 0; i < n; i++) {
                      if (keep[i]) { out[j++] = p.a[2 * i]; out[j++] = p.a[2 * i + 1]; }
                  }
                  return out;
              }

              static List<float[]> order(List<float[]> in) {
                  List<float[]> rest = new ArrayList<>(in);
                  List<float[]> out = new ArrayList<>();
                  float cx = 0, cy = 0;
                  while (!rest.isEmpty()) {
                      int bi = 0;
                      boolean rev = false;
                      float bd = 1e18f;
                      for (int i = 0; i < rest.size(); i++) {
                          float[] s = rest.get(i);
                          float d1 = (s[0] - cx) * (s[0] - cx) + (s[1] - cy) * (s[1] - cy);
                          float ex = s[s.length - 2], ey = s[s.length - 1];
                          float d2 = (ex - cx) * (ex - cx) + (ey - cy) * (ey - cy);
                          if (d1 < bd) { bd = d1; bi = i; rev = false; }
                          if (d2 < bd) { bd = d2; bi = i; rev = true; }
                      }
                      float[] s = rest.remove(bi);
                      if (rev) {
                          float[] r = new float[s.length];
                          for (int k = 0; k < s.length; k += 2) {
                              r[k] = s[s.length - 2 - k];
                              r[k + 1] = s[s.length - 1 - k];
                          }
                          s = r;
                      }
                      out.add(s);
                      cx = s[s.length - 2];
                      cy = s[s.length - 1];
                  }
                  return out;
              }
          }
          EOF

          cat > app/src/main/java/com/autodraw/MainActivity.java <<'EOF'
          package com.autodraw;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              int[] pixels;
              int pw, ph;
              Tracer.Result result;
              ImageView preview;
              TextView info, speedLabel;
              SeekBar detail, speed;
              int jobId = 0;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 70, 40, 30);

                  TextView ver = new TextView(this);
                  ver.setText("الإصدار 6");

                  Button b1 = new Button(this);
                  b1.setText("1) تفعيل خدمة الرسم");
                  b1.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));

                  Button b2 = new Button(this);
                  b2.setText("2) اختيار صورة");
                  b2.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                      i.setType("image/*");
                      startActivityForResult(i, 1);
                  });

                  TextView t1 = new TextView(this);
                  t1.setText("مستوى التفاصيل:");
                  detail = new SeekBar(this);
                  detail.setMax(100);
                  detail.setProgress(55);
                  detail.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int p, boolean user) {}
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) { process(); }
                  });

                  speedLabel = new TextView(this);
                  speed = new SeekBar(this);
                  speed.setMax(100);
                  speed.setProgress(25);
                  speed.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int p, boolean user) { updateInfo(); }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });

                  preview = new ImageView(this);
                  preview.setBackgroundColor(Color.WHITE);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  info = new TextView(this);

                  Button b3 = new Button(this);
                  b3.setText("3) ابدأ");
                  b3.setOnClickListener(v -> start());

                  root.addView(ver);
                  root.addView(b1);
                  root.addView(b2);
                  root.addView(t1);
                  root.addView(detail);
                  root.addView(speedLabel);
                  root.addView(speed);
                  root.addView(preview, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  root.addView(info);
                  root.addView(b3);
                  setContentView(root);
                  updateInfo();
              }

              float currentSpeed() {
                  return 60f + speed.getProgress() * 4f;
              }

              @Override
              protected void onActivityResult(int rc, int res, Intent data) {
                  super.onActivityResult(rc, res, data);
                  if (rc == 1 && res == RESULT_OK && data != null && data.getData() != null) {
                      load(data.getData());
                  }
              }

              void load(Uri uri) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          BitmapFactory.decodeStream(in, null, o);
                      }
                      int ss = 1;
                      while (Math.max(o.outWidth, o.outHeight) / ss > 2000) ss *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = ss;
                      Bitmap full;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          full = BitmapFactory.decodeStream(in, null, o);
                      }
                      float k = Math.min(3f, 720f / Math.max(full.getWidth(), full.getHeight()));
                      pw = Math.max(16, (int) (full.getWidth() * k));
                      ph = Math.max(16, (int) (full.getHeight() * k));
                      Bitmap scaled = Bitmap.createScaledBitmap(full, pw, ph, true);
                      Bitmap flat = Bitmap.createBitmap(pw, ph, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(flat);
                      c.drawColor(Color.WHITE);
                      c.drawBitmap(scaled, 0, 0, null);
                      pixels = new int[pw * ph];
                      flat.getPixels(pixels, 0, pw, 0, 0, pw, ph);
                      process();
                  } catch (Exception e) {
                      Toast.makeText(this, "تعذر فتح الصورة", Toast.LENGTH_SHORT).show();
                  }
              }

              void process() {
                  if (pixels == null) return;
                  final int id = ++jobId;
                  final int d = detail.getProgress();
                  final int[] px = pixels;
                  final int w = pw, h = ph;
                  info.setText("جارٍ استخراج الخطوط...");
                  new Thread(() -> {
                      try {
                          final Tracer.Result r = Tracer.trace(px, w, h, d);
                          final Bitmap pv = render(r);
                          runOnUiThread(() -> {
                              if (id != jobId) return;
                              result = r;
                              preview.setImageBitmap(pv);
                              updateInfo();
                          });
                      } catch (Throwable t) {
                          final String msg = String.valueOf(t);
                          runOnUiThread(() -> info.setText("خطأ: " + msg));
                      }
                  }).start();
              }

              Bitmap render(Tracer.Result r) {
                  int rw = Math.max(1, r.w), rh = Math.max(1, r.h);
                  float sc = Math.min(1000f / rw, 1400f / rh);
                  Bitmap bm = Bitmap.createBitmap((int) (rw * sc) + 8, (int) (rh * sc) + 8, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(bm);
                  cv.drawColor(Color.WHITE);
                  Paint p = new Paint();
                  p.setColor(Color.BLACK);
                  p.setStrokeWidth(2f);
                  p.setAntiAlias(true);
                  for (float[] s : r.strokes) {
                      for (int k = 2; k < s.length; k += 2) {
                          cv.drawLine(s[k - 2] * sc + 4, s[k - 1] * sc + 4, s[k] * sc + 4, s[k + 1] * sc + 4, p);
                      }
                  }
                  return bm;
              }

              void updateInfo() {
                  float sp = currentSpeed();
                  speedLabel.setText("سرعة الرسم: " + (int) sp + " بكسل/ثانية  (الأقل = أبطأ)");
                  if (result == null) return;
                  int secs = (int) (result.totalLen * 1.5f / sp);
                  String t = secs >= 60 ? (secs / 60) + " دقيقة تقريباً" : secs + " ثانية تقريباً";
                  info.setText("عدد الخطوط: " + result.strokes.size() + "  |  الزمن: " + t);
              }

              void start() {
                  if (result == null || result.strokes.isEmpty()) {
                      Toast.makeText(this, "اختر صورة أولاً", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (DrawService.instance == null) {
                      Toast.makeText(this, "فعّل الخدمة أولاً", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      return;
                  }
                  DrawService.strokes = result.strokes;
                  DrawService.imgW = result.w;
                  DrawService.imgH = result.h;
                  DrawService.speed = currentSpeed();
                  DrawService.instance.showFab();
                  Toast.makeText(this, "افتح اللعبة ثم اضغط زر 🎨", Toast.LENGTH_LONG).show();
                  moveTaskToBack(true);
              }
          }
          EOF

          cat > app/src/main/java/com/autodraw/DrawService.java <<'EOF'
          package com.autodraw;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.List;

          public class DrawService extends AccessibilityService {
              static DrawService instance;
              static List<float[]> strokes;
              static float imgW, imgH;
              static float speed = 160f;

              WindowManager wm;
              TextView fab;
              WindowManager.LayoutParams fabLp;
              FrameLayout calib;
              TextView calibText;
              View frame;
              Runnable pendingBegin;
              final Handler h = new Handler(Looper.getMainLooper());
              boolean drawing, cancel;
              float cx1, cy1;
              int taps;
              int okCount, failCount;

              @Override
              protected void onServiceConnected() {
                  instance = this;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}

              @Override
              public boolean onUnbind(Intent i) {
                  instance = null;
                  hideAll();
                  return super.onUnbind(i);
              }

              void hideAll() {
                  removeFrame();
                  try { if (fab != null) wm.removeView(fab); } catch (Exception e) {}
                  try { if (calib != null) wm.removeView(calib); } catch (Exception e) {}
                  fab = null;
                  calib = null;
              }

              void removeFrame() {
                  try { if (frame != null) wm.removeView(frame); } catch (Exception e) {}
                  frame = null;
              }

              void setFab(String text, int size) {
                  if (fab == null) return;
                  fab.setTextSize(size);
                  fab.setText(text);
              }

              void showFab() {
                  if (fab != null) return;
                  fab = new TextView(this);
                  fab.setText("🎨");
                  fab.setTextSize(26);
                  fab.setGravity(Gravity.CENTER);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(0xCC3F51B5);
                  fab.setBackground(bg);
                  int size = (int) (56 * getResources().getDisplayMetrics().density);
                  fabLp = new WindowManager.LayoutParams(size, size,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE | WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON,
                          PixelFormat.TRANSLUCENT);
                  fabLp.gravity = Gravity.TOP | Gravity.LEFT;
                  fabLp.x = getResources().getDisplayMetrics().widthPixels - size - 20;
                  fabLp.y = 400;
                  fab.setOnTouchListener(new View.OnTouchListener() {
                      float sx, sy;
                      int ox, oy;
                      boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  sx = e.getRawX();
                                  sy = e.getRawY();
                                  ox = fabLp.x;
                                  oy = fabLp.y;
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  if (!moved && Math.abs(e.getRawX() - sx) + Math.abs(e.getRawY() - sy) > 20) moved = true;
                                  if (moved) {
                                      fabLp.x = (int) (ox + e.getRawX() - sx);
                                      fabLp.y = (int) (oy + e.getRawY() - sy);
                                      wm.updateViewLayout(fab, fabLp);
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) onFabClick();
                                  return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(fab, fabLp);
              }

              void onFabClick() {
                  if (drawing) {
                      cancel = true;
                  } else if (pendingBegin != null) {
                      h.removeCallbacks(pendingBegin);
                      pendingBegin = null;
                      removeFrame();
                      setFab("🎨", 26);
                  } else if (calib == null) {
                      startCalibration();
                  }
              }

              void startCalibration() {
                  if (strokes == null || strokes.isEmpty()) return;
                  setFab("🎨", 26);
                  taps = 0;
                  calib = new FrameLayout(this);
                  calib.setBackgroundColor(0x55000000);
                  calibText = new TextView(this);
                  calibText.setTextColor(Color.WHITE);
                  calibText.setTextSize(18);
                  calibText.setGravity(Gravity.CENTER);
                  calibText.setBackgroundColor(0xCC000000);
                  calibText.setPadding(30, 30, 30, 30);
                  calibText.setText("اضغط على الزاوية العلوية اليسرى للوحة الرسم");
                  calib.addView(calibText, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP));
                  calib.setOnTouchListener((v, e) -> {
                      if (e.getAction() == MotionEvent.ACTION_UP) onCalibTap(e.getRawX(), e.getRawY());
                      return true;
                  });
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  wm.addView(calib, lp);
              }

              void onCalibTap(float x, float y) {
                  if (taps == 0) {
                      cx1 = x;
                      cy1 = y;
                      taps = 1;
                      calibText.setText("الآن اضغط على الزاوية السفلية اليمنى للوحة");
                      return;
                  }
                  try { wm.removeView(calib); } catch (Exception e) {}
                  calib = null;
                  final float x1 = cx1, y1 = cy1, x2 = x, y2 = y;
                  if (x2 - x1 < 100 || y2 - y1 < 100) {
                      Toast.makeText(this, "المنطقة غير صحيحة، اضغط الزر وحاول مرة أخرى", Toast.LENGTH_LONG).show();
                      return;
                  }
                  float rw = x2 - x1, rh = y2 - y1;
                  final float sc = Math.min(rw / imgW, rh / imgH);
                  final float ox = x1 + (rw - imgW * sc) / 2f;
                  final float oy = y1 + (rh - imgH * sc) / 2f;
                  // إطار أحمر يوضح مكان الرسم قبل البدء (اضغط الزر لإلغاء إن كان المكان خاطئاً)
                  showFrame(ox, oy, imgW * sc, imgH * sc);
                  setFab("إلغاء", 11);
                  pendingBegin = () -> {
                      pendingBegin = null;
                      try {
                          beginDraw(x1, y1, y2, ox, oy, sc);
                      } catch (Exception e) {
                          finishDraw("خطأ");
                      }
                  };
                  h.postDelayed(pendingBegin, 2000);
              }

              void showFrame(float ox, float oy, float w, float hh) {
                  removeFrame();
                  try {
                      frame = new View(this);
                      GradientDrawable gd = new GradientDrawable();
                      gd.setColor(0x00000000);
                      gd.setStroke(5, 0xFFFF1744);
                      frame.setBackground(gd);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              Math.max(1, (int) w), Math.max(1, (int) hh),
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.TOP | Gravity.LEFT;
                      lp.x = (int) ox;
                      lp.y = (int) oy;
                      wm.addView(frame, lp);
                  } catch (Exception e) {
                      frame = null;
                  }
              }

              void beginDraw(float x1, float y1, float y2, float ox, float oy, float sc) {
                  removeFrame();
                  drawing = true;
                  cancel = false;
                  okCount = 0;
                  failCount = 0;
                  if (fab != null) {
                      setFab("⏹", 11);
                      // ننقل الزر خارج اللوحة حتى لا تصطدم به لمسات الرسم
                      int size = fabLp.width;
                      int screenH = getResources().getDisplayMetrics().heightPixels;
                      int ny = (int) y2 + 15;
                      if (ny + size > screenH) ny = Math.max(0, (int) y1 - size - 15);
                      fabLp.x = (int) x1;
                      fabLp.y = ny;
                      try { wm.updateViewLayout(fab, fabLp); } catch (Exception e) {}
                  }
                  Toast.makeText(this, "بدأ الرسم: " + strokes.size() + " خط", Toast.LENGTH_SHORT).show();
                  drawNext(0, ox, oy, sc);
              }

              void finishDraw(String msg) {
                  drawing = false;
                  cancel = false;
                  setFab(okCount + "✓\n" + failCount + "✗", 11);
                  Toast.makeText(this, msg + "  (نجح " + okCount + " / فشل " + failCount + ")", Toast.LENGTH_LONG).show();
              }

              void drawNext(int i, float ox, float oy, float sc) {
                  try {
                      drawStroke(i, ox, oy, sc);
                  } catch (Exception e) {
                      finishDraw("خطأ: " + e);
                  }
              }

              void drawStroke(int i, float ox, float oy, float sc) {
                  if (cancel) { finishDraw("تم الإيقاف"); return; }
                  if (strokes == null || i >= strokes.size()) { finishDraw("انتهى الرسم"); return; }
                  float[] s = strokes.get(i);
                  setFab("⏹\n" + i + "/" + strokes.size(), 11);
                  Path p = new Path();
                  float px = ox + (s[0] + 0.5f) * sc, py = oy + (s[1] + 0.5f) * sc;
                  p.moveTo(px, py);
                  float len = 0;
                  for (int k = 2; k < s.length; k += 2) {
                      float qx = ox + (s[k] + 0.5f) * sc, qy = oy + (s[k + 1] + 0.5f) * sc;
                      p.lineTo(qx, qy);
                      len += (float) Math.hypot(qx - px, qy - py);
                      px = qx;
                      py = qy;
                  }
                  if (len < 2f) {
                      h.post(() -> drawNext(i + 1, ox, oy, sc));
                      return;
                  }
                  long dur = (long) Math.max(150f, Math.min(59000f, len / speed * 1000f));
                  GestureDescription gd = new GestureDescription.Builder()
                          .addStroke(new GestureDescription.StrokeDescription(p, 0, dur))
                          .build();
                  GestureResultCallback cb = new GestureResultCallback() {
                      @Override public void onCompleted(GestureDescription g) {
                          okCount++;
                          h.postDelayed(() -> drawNext(i + 1, ox, oy, sc), 40);
                      }
                      @Override public void onCancelled(GestureDescription g) {
                          failCount++;
                          h.postDelayed(() -> drawNext(i + 1, ox, oy, sc), 40);
                      }
                  };
                  if (!dispatchGesture(gd, cb, null)) {
                      failCount++;
                      h.postDelayed(() -> drawNext(i + 1, ox, oy, sc), 40);
                  }
              }
          }
