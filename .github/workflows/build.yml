                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));

                  TextView hint = new TextView(this);
                  hint.setText("اسحب الزوايا للتكبير والتصغير، واسحب الداخل للتحريك");
                  hint.setTextColor(Color.WHITE);
                  hint.setTextSize(14);
                  hint.setGravity(Gravity.CENTER);
                  hint.setPadding(dp(18), dp(12), dp(18), dp(12));
                  hint.setBackground(glass(dp(20), true, dp(14)));
                  FrameLayout.LayoutParams hp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP | Gravity.CENTER_HORIZONTAL);
                  hp.topMargin = dp(60);
                  root.addView(hint, hp);

                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER);
                  TextView no = roundBtn("✕", 0xFFFF453A);
                  TextView ok = roundBtn("✓", 0xFF30D158);
                  no.setOnClickListener(v -> removeRegionOverlay());
                  ok.setOnClickListener(v -> {
                      region = new RectF(regionView.r);
                      removeRegionOverlay();
                      Toast.makeText(this, "تم تحديد موقع الرسمة ✓", Toast.LENGTH_SHORT).show();
                  });
                  LinearLayout.LayoutParams bp = new LinearLayout.LayoutParams(dp(68), dp(68));
                  bp.setMargins(dp(14), 0, dp(14), 0);
                  bar.addView(no, bp);
                  bar.addView(ok, bp);
                  FrameLayout.LayoutParams barLp = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM | Gravity.CENTER_HORIZONTAL);
                  barLp.bottomMargin = dp(70);
                  root.addView(bar, barLp);

                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  try {
                      wm.addView(root, lp);
                      regionOverlay = root;
                  } catch (Exception e) {
                      regionOverlay = null;
                      regionView = null;
                  }
              }

              TextView roundBtn(String text, int color) {
                  TextView t = new TextView(this);
                  t.setText(text);
                  t.setTextColor(color);
                  t.setTextSize(30);
                  t.setGravity(Gravity.CENTER);
                  t.setBackground(glass(dp(100), true, dp(34)));
                  t.setClickable(true);
                  t.setOnTouchListener((v, e) -> {
                      int a = e.getAction();
                      if (a == MotionEvent.ACTION_DOWN) v.setAlpha(0.55f);
                      else if (a == MotionEvent.ACTION_UP || a == MotionEvent.ACTION_CANCEL) v.setAlpha(1f);
                      return false;
                  });
                  return t;
              }

              void removeRegionOverlay() {
                  try { if (regionOverlay != null) wm.removeView(regionOverlay); } catch (Exception e) {}
                  regionOverlay = null;
                  regionView = null;
              }

              // ============ بدء الرسم ============
              void prepareStart() {
                  final float x1 = region.left, y1 = region.top, y2 = region.bottom;
                  float rw = region.width(), rh = region.height();
                  if (rw < 100 || rh < 100) {
                      Toast.makeText(this, "المنطقة صغيرة جداً، حدد موقعاً أكبر", Toast.LENGTH_LONG).show();
                      return;
                  }
                  final float sc = Math.min(rw / imgW, rh / imgH);
                  final float ox = x1 + (rw - imgW * sc) / 2f;
                  final float oy = y1 + (rh - imgH * sc) / 2f;
                  // إطار أحمر يوضح مكان الرسم قبل البدء (اضغط الزر لإلغاء إن كان المكان خاطئاً)
                  showFrame(ox, oy, imgW * sc, imgH * sc);
                  setFab("إلغاء", 11);
                  pendingBegin = () -> {
                      pendingBegin = null;
                      try {
                          beginDraw(x1, y1, y2, ox, oy, sc);
                      } catch (Exception e) {
                          finishDraw("خطأ");
                      }
                  };
                  h.postDelayed(pendingBegin, 1500);
              }

              void showFrame(float ox, float oy, float w, float hh) {
                  removeFrame();
                  try {
                      frame = new View(this);
                      GradientDrawable gd = new GradientDrawable();
                      gd.setColor(0x00000000);
                      gd.setStroke(5, 0xFFFF1744);
                      frame.setBackground(gd);
                      WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                              Math.max(1, (int) w), Math.max(1, (int) hh),
                              WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                              WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                      | WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                      | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                              PixelFormat.TRANSLUCENT);
                      lp.gravity = Gravity.TOP | Gravity.LEFT;
                      lp.x = (int) ox;
                      lp.y = (int) oy;
                      wm.addView(frame, lp);
                  } catch (Exception e) {
                      frame = null;
                  }
              }

              void beginDraw(float x1, float y1, float y2, float ox, float oy, float sc) {
                  removeFrame();
                  plan = buildPlan(ox, oy, sc);
                  drawing = true;
                  cancel = false;
                  paused = false;
                  loopWaiting = false;
                  okCount = 0;
                  failCount = 0;
                  if (fab != null) {
                      setFab("✎", 22);
                      // ننقل الزر خارج اللوحة حتى لا تصطدم به لمسات الرسم
                      int size = fabLp.width;
                      int screenH = getResources().getDisplayMetrics().heightPixels;
                      int ny = (int) y2 + 15;
                      if (ny + size > screenH) ny = Math.max(0, (int) y1 - size - 15);
                      fabLp.x = (int) x1;
                      fabLp.y = ny;
                      try { wm.updateViewLayout(fab, fabLp); } catch (Exception e) {}
                  }
                  Toast.makeText(this, "بدأ الرسم: " + plan.size() + " ضربة", Toast.LENGTH_SHORT).show();
                  drawNext(0);
              }

              float length(float[] t) {
                  float len = 0;
                  for (int k = 2; k < t.length; k += 2) len += (float) Math.hypot(t[k] - t[k - 2], t[k + 1] - t[k - 1]);
                  return len;
              }

              /** يحوّل الخطوط إلى ضربات قلم؛ في الوضع البشري: سرعات متغيرة، اهتزاز يد خفيف، رفع قلم وتوقفات طبيعية. */
              List<Piece> buildPlan(float ox, float oy, float sc) {
                  Random rnd = new Random();
                  List<float[]> screen = new ArrayList<>();
                  for (float[] s : strokes) {
                      float[] t = new float[s.length];
                      for (int k = 0; k < s.length; k += 2) {
                          t[k] = ox + (s[k] + 0.5f) * sc;
                          t[k + 1] = oy + (s[k + 1] + 0.5f) * sc;
                      }
                      screen.add(t);
                  }
                  if (human) {
                      // الإنسان يرسم الخطوط العامة الطويلة أولاً ثم التفاصيل
                      List<float[]> big = new ArrayList<>();
                      List<float[]> small = new ArrayList<>();
                      for (float[] t : screen) {
                          if (length(t) >= 120f) big.add(t); else small.add(t);
                      }
                      screen = big;
                      screen.addAll(small);
                  }
                  List<Piece> out = new ArrayList<>();
                  float drift = 1f, wx = 0, wy = 0;
                  for (float[] t : screen) {
                      float len = length(t);
                      if (len < 2f) continue;
                      float[] pts = t;
                      if (human) {
                          pts = t.clone();
                          for (int k = 0; k < pts.length; k += 2) {
                              wx = 0.75f * wx + 0.25f * (float) rnd.nextGaussian() * 1.1f;
                              wy = 0.75f * wy + 0.25f * (float) rnd.nextGaussian() * 1.1f;
                              pts[k] += wx;
                              pts[k + 1] += wy;
                          }
                      }
                      List<float[]> parts = new ArrayList<>();
                      int n = pts.length / 2;
                      if (human && len > 220f && n >= 6 && rnd.nextFloat() < 0.6f) {
                          int cut = 2 + rnd.nextInt(n - 4);
                          parts.add(Arrays.copyOfRange(pts, 0, 2 * (cut + 1)));
                          parts.add(Arrays.copyOfRange(pts, 2 * cut, pts.length));
                      } else {
                          parts.add(pts);
                      }
                      for (int pi = 0; pi < parts.size(); pi++) {
                          float[] q = parts.get(pi);
                          float ql = length(q);
                          if (ql < 2f) continue;
                          Piece pc = new Piece();
                          pc.pts = q;
                          float sp = speed;
                          if (human) {
                              drift = Math.max(0.75f, Math.min(1.3f, drift + (rnd.nextFloat() - 0.5f) * 0.15f));
                              sp = speed * drift * (0.8f + rnd.nextFloat() * 0.45f);
                          }
                          pc.dur = (long) Math.max(150f, Math.min(59000f, ql / sp * 1000f));
                          if (human) {
                              pc.pause = rnd.nextInt(350);
                              if (rnd.nextFloat() < 0.07f) pc.pause += 1200 + rnd.nextInt(1800);
                              if (pi == 0 && parts.size() > 1) pc.pause = rnd.nextInt(60);
                          } else {
                              pc.pause = 0;
                          }
                          out.add(pc);
                      }
                  }
                  return out;
              }

              void finishDraw(String msg) {
                  drawing = false;
                  cancel = false;
                  paused = false;
                  loopWaiting = false;
                  setFab(okCount + "✓\n" + failCount + "✗", 11);
                  Toast.makeText(this, msg + "  (نجح " + okCount + " / فشل " + failCount + ")", Toast.LENGTH_LONG).show();
              }

              void drawNext(int i) {
                  try {
                      drawPiece(i);
                  } catch (Exception e) {
                      finishDraw("خطأ: " + e);
                  }
              }

              void drawPiece(int i) {
                  if (cancel) { finishDraw("تم الإيقاف"); return; }
                  if (paused) {
                      // نتوقف هنا ونحفظ مكاننا؛ عند "إكمال" نكمل من نفس الضربة
                      resumeIdx = i;
                      loopWaiting = true;
                      return;
                  }
                  if (plan == null || i >= plan.size()) { finishDraw("انتهى الرسم"); return; }
                  final Piece pc = plan.get(i);
                  setFab("✎\n" + i + "/" + plan.size(), 11);
                  Path p = new Path();
                  p.moveTo(pc.pts[0], pc.pts[1]);
                  for (int k = 2; k < pc.pts.length; k += 2) p.lineTo(pc.pts[k], pc.pts[k + 1]);
                  GestureDescription gd = new GestureDescription.Builder()
                          .addStroke(new GestureDescription.StrokeDescription(p, 0, pc.dur))
                          .build();
                  GestureResultCallback cb = new GestureResultCallback() {
                      @Override public void onCompleted(GestureDescription g) {
                          okCount++;
                          h.postDelayed(() -> drawNext(i + 1), delayMs + pc.pause);
                      }
                      @Override public void onCancelled(GestureDescription g) {
                          failCount++;
                          h.postDelayed(() -> drawNext(i + 1), delayMs + pc.pause);
                      }
                  };
                  if (!dispatchGesture(gd, cb, null)) {
                      failCount++;
                      h.postDelayed(() -> drawNext(i + 1), delayMs + pc.pause);
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "APK ${{ github.run_number }}" \
            --notes "AutoDraw"
