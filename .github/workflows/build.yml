              @Override
              protected void onNewIntent(Intent i) {
                  super.onNewIntent(i);
                  setIntent(i);
                  handleIntent(i);
              }

              void handleIntent(Intent i) {
                  if (i != null && i.getBooleanExtra("paywall", false)) {
                      i.removeExtra("paywall");
                      showCodeDialog(!License.canUse(this));
                  }
                  if (i != null && Intent.ACTION_SEND.equals(i.getAction())
                          && i.getType() != null && i.getType().startsWith("image/")) {
                      Uri shared = i.getParcelableExtra(Intent.EXTRA_STREAM);
                      i.setAction(Intent.ACTION_MAIN);
                      if (shared != null) load(shared);
                  }
              }

              Switch makeSwitch(final String key, boolean def, final boolean reprocess) {
                  Switch sw = new Switch(this);
                  sw.setChecked(prefs.getBoolean(key, def));
                  int[][] states = {{android.R.attr.state_checked}, {}};
                  sw.setTrackTintList(new ColorStateList(states, new int[]{GREEN, 0x55FFFFFF}));
                  sw.setThumbTintList(ColorStateList.valueOf(Color.WHITE));
                  sw.setOnCheckedChangeListener((b, on) -> {
                      b.performHapticFeedback(HapticFeedbackConstants.VIRTUAL_KEY);
                      prefs.edit().putBoolean(key, on).apply();
                      if (reprocess) process();
                  });
                  return sw;
              }

              SeekBar makeSeek(int max, final String key, int def, final TextView out,
                               final java.util.function.IntFunction<String> fmt, final boolean reprocess) {
                  SeekBar sb = new SeekBar(this);
                  sb.setMax(max);
                  sb.setProgress(prefs.getInt(key, def));
                  tintSeek(sb);
                  out.setText(fmt.apply(sb.getProgress()));
                  sb.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar s, int p, boolean user) {
                          out.setText(fmt.apply(p));
                      }
                      @Override public void onStartTrackingTouch(SeekBar s) {}
                      @Override public void onStopTrackingTouch(SeekBar s) {
                          prefs.edit().putInt(key, s.getProgress()).apply();
                          if (reprocess) process();
                      }
                  });
                  return sb;
              }

