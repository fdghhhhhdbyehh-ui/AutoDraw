                      load(data.getData());
                  }
              }

              Bitmap flatten(Bitmap src, float k) {
                  int w = Math.max(16, (int) (src.getWidth() * k));
                  int h = Math.max(16, (int) (src.getHeight() * k));
                  Bitmap scaled = Bitmap.createScaledBitmap(src, w, h, true);
                  Bitmap flat = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                  Canvas c = new Canvas(flat);
                  c.drawColor(Color.WHITE);
                  c.drawBitmap(scaled, 0, 0, null);
                  return flat;
              }

              void load(Uri uri) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          BitmapFactory.decodeStream(in, null, o);
                      }
                      int ss = 1;
                      while (Math.max(o.outWidth, o.outHeight) / ss > 2000) ss *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = ss;
                      Bitmap full;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          full = BitmapFactory.decodeStream(in, null, o);
                      }
                      int m = Math.max(full.getWidth(), full.getHeight());
                      Bitmap flat = flatten(full, Math.min(3f, 720f / m));
                      pw = flat.getWidth();
                      ph = flat.getHeight();
                      pixels = new int[pw * ph];
                      flat.getPixels(pixels, 0, pw, 0, 0, pw, ph);
                      aiInput = flatten(full, Math.min(1f, 1024f / m));
                      imgGen++;
                      aiPixels = null;
                      aiError = null;
                      aiStatus = "";
                      aiBusy = false;
                      again = false;
                      process();
                  } catch (Exception e) {
                      Toast.makeText(this, "تعذر فتح الصورة", Toast.LENGTH_SHORT).show();
                  }
              }

              void process() {
                  if (pixels == null) return;
                  if (aiBusy) { again = true; return; }
                  saveSettings();
                  final int id = ++jobId;
                  final int gen = imgGen;
                  final int d = detail.getProgress();
                  final int[] px = pixels;
                  final int w = pw, h = ph;
                  final boolean useAi = aiSwitch.isChecked();
                  final String key = keyEdit.getText().toString().trim();
                  String mm = modelEdit.getText().toString().trim();
                  final String model = mm.isEmpty() ? DEFAULT_MODEL : mm;
                  final Bitmap src = aiInput;
                  final String cachedErr = aiError;
                  final int[] cachedPx = aiPixels;
                  final int cw = aiW, ch = aiH;
                  final boolean needAi = useAi && key.length() > 0 && cachedPx == null && cachedErr == null && src != null;
                  if (needAi) aiBusy = true;
                  info.setText(needAi ? "جارٍ تحليل الصورة بالذكاء الاصطناعي..." : "جارٍ استخراج الخطوط...");
                  new Thread(() -> {
                      try {
                          int[] ap = cachedPx;
                          int aw = cw, ah = ch;
                          String err = cachedErr;
                          if (needAi) {
                              try {
                                  Bitmap line = AiLines.extract(src, key, model);
                                  aw = line.getWidth();
                                  ah = line.getHeight();
                                  ap = new int[aw * ah];
                                  line.getPixels(ap, 0, aw, 0, 0, aw, ah);
                              } catch (Throwable t) {
                                  err = String.valueOf(t);
                              }
                          }
                          Tracer.Result r = null;
                          boolean usedAi = false;
                          if (useAi && ap != null) {
                              r = Tracer.traceLines(ap, aw, ah, d);
                              usedAi = !r.strokes.isEmpty();
                              if (!usedAi && err == null) err = "الصورة الناتجة لا تحتوي خطوطاً";
                          }
                          if (!usedAi) r = Tracer.trace(px, w, h, d);
                          String st = "";
                          if (useAi) {
                              if (key.length() == 0) st = "أدخل مفتاح API لتفعيل الذكاء الاصطناعي";
                              else if (usedAi) st = "✨ الخطوط مستخرجة بالذكاء الاصطناعي";
                              else st = "تعذر الذكاء الاصطناعي واستُخدمت الطريقة العادية: " + AiLines.shorten(err);
                          }
                          final Tracer.Result fr = r;
                          final Bitmap pv = render(r);
                          final int[] fap = ap;
                          final int faw = aw, fah = ah;
                          final String ferr = err, fst = st;
                          runOnUiThread(() -> {
                              if (gen != imgGen) return;
                              if (fap != null) { aiPixels = fap; aiW = faw; aiH = fah; }
                              aiError = ferr;
                              if (needAi) {
                                  aiBusy = false;
                                  if (again) { again = false; process(); return; }
                              }
                              if (id != jobId) return;
                              result = fr;
                              aiStatus = fst;
                              preview.setImageBitmap(pv);
                              updateInfo();
                          });
                      } catch (Throwable t) {
                          final String msg = String.valueOf(t);
                          runOnUiThread(() -> {
                              if (gen == imgGen && needAi) aiBusy = false;
                              info.setText("خطأ: " + msg);
                          });
                      }
                  }).start();
              }

              Bitmap render(Tracer.Result r) {
                  int rw = Math.max(1, r.w), rh = Math.max(1, r.h);
                  float sc = Math.min(1000f / rw, 1400f / rh);
                  Bitmap bm = Bitmap.createBitmap((int) (rw * sc) + 8, (int) (rh * sc) + 8, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(bm);
                  cv.drawColor(Color.WHITE);
                  Paint p = new Paint();
                  p.setColor(Color.BLACK);
                  p.setStrokeWidth(2f);
                  p.setAntiAlias(true);
                  for (float[] s : r.strokes) {
                      for (int k = 2; k < s.length; k += 2) {
                          cv.drawLine(s[k - 2] * sc + 4, s[k - 1] * sc + 4, s[k] * sc + 4, s[k + 1] * sc + 4, p);
                      }
                  }
                  return bm;
              }

              void updateInfo() {
                  float sp = currentSpeed();
                  String num = sp < 10f ? String.format(Locale.US, "%.1f", sp) : String.valueOf((int) sp);
                  speedLabel.setText("سرعة الرسم: " + speedName(sp) + " (" + num + " بكسل/ث)");
                  if (result == null) {
                      info.setText(aiStatus);
                      return;
                  }
                  int secs = (int) (result.totalLen * 1.5f / sp);
                  String t;
                  if (secs >= 3600) t = (secs / 3600) + " ساعة و " + ((secs % 3600) / 60) + " دقيقة تقريباً";
                  else if (secs >= 60) t = (secs / 60) + " دقيقة تقريباً";
                  else t = secs + " ثانية تقريباً";
                  String s = "عدد الخطوط: " + result.strokes.size() + "  |  الزمن: " + t;
                  if (aiStatus.length() > 0) s += "\n" + aiStatus;
                  info.setText(s);
              }

              void start() {
                  if (result == null || result.strokes.isEmpty()) {
                      Toast.makeText(this, "اختر صورة أولاً", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (DrawService.instance == null) {
                      Toast.makeText(this, "فعّل الخدمة أولاً", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      return;
                  }
                  DrawService.strokes = result.strokes;
                  DrawService.imgW = result.w;
                  DrawService.imgH = result.h;
                  DrawService.speed = currentSpeed();
                  DrawService.human = humanSwitch.isChecked();
                  DrawService.instance.showFab();
                  Toast.makeText(this, "افتح اللعبة ثم اضغط زر 🎨", Toast.LENGTH_LONG).show();
                  moveTaskToBack(true);
              }
          }
