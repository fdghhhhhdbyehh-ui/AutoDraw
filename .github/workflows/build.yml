name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/autodraw app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoDraw"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.autodraw'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.autodraw'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="رسام تلقائي"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".DrawService"
                      android:exported="true"
                      android:label="رسام تلقائي"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/desc"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="desc">يسمح لتطبيق الرسم التلقائي بتنفيذ حركات الرسم على الشاشة فقط.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/autodraw/Tracer.java <<'EOF'
          package com.autodraw;

          import java.util.ArrayDeque;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;

          /** استخراج خطوط نظيفة من صورة: Canny + تنحيف + تتبع مستمر للخطوط. بدون أي اعتماد على أندرويد. */
          class Tracer {
              static class Result {
                  List<float[]> strokes = new ArrayList<>();
                  int w, h;
                  float totalLen;
              }

              static final int[] DX = {1, 1, 0, -1, -1, -1, 0, 1};
              static final int[] DY = {0, 1, 1, 1, 0, -1, -1, -1};
              static final int GAP = 4;

              static class IL {
                  int[] a = new int[64];
                  int n;
                  void add(int v) {
                      if (n == a.length) a = Arrays.copyOf(a, n * 2);
                      a[n++] = v;
                  }
              }

              static Result trace(int[] argb, int w, int h, int detail) {
                  int n = w * h;
                  float d = detail / 100f;
                  Result res = new Result();
                  res.w = w;
                  res.h = h;

                  // 1) رمادي (الشفافية فوق خلفية بيضاء)
                  float[] gray = new float[n];
                  for (int i = 0; i < n; i++) {
                      int c = argb[i];
                      float a = ((c >>> 24) & 255) / 255f;
                      float r = ((c >> 16) & 255) * a + 255f * (1 - a);
                      float g = ((c >> 8) & 255) * a + 255f * (1 - a);
                      float b = (c & 255) * a + 255f * (1 - a);
                      gray[i] = 0.299f * r + 0.587f * g + 0.114f * b;
                  }

                  // 2) تنعيم غاوسي (تفاصيل أقل = تنعيم أكبر)
                  float[] bl = blur(gray, w, h, 2.0f - 1.0f * d);

                  // 3) Sobel
                  float[] gx = new float[n], gy = new float[n], mag = new float[n];
                  float maxMag = 0;
                  for (int y = 1; y < h - 1; y++) {
                      for (int x = 1; x < w - 1; x++) {
                          int i = y * w + x;
                          float sx = -bl[i - w - 1] - 2 * bl[i - 1] - bl[i + w - 1] + bl[i - w + 1] + 2 * bl[i + 1] + bl[i + w + 1];
                          float sy = -bl[i - w - 1] - 2 * bl[i - w] - bl[i - w + 1] + bl[i + w - 1] + 2 * bl[i + w] + bl[i + w + 1];
                          gx[i] = sx;
                          gy[i] = sy;
                          float m = (float) Math.sqrt(sx * sx + sy * sy);
                          mag[i] = m;
                          if (m > maxMag) maxMag = m;
                      }
                  }
                  if (maxMag <= 0) return res;

                  // عتبات تلقائية من توزيع قوة الحواف
                  int[] hist = new int[1024];
                  for (int i = 0; i < n; i++) hist[Math.min(1023, (int) (mag[i] / maxMag * 1023))]++;
                  long target = (long) (n * 0.985), acc = 0;
                  int bin = 0;
                  for (; bin < 1024; bin++) {
                      acc += hist[bin];
                      if (acc >= target) break;
                  }
                  float pv = (Math.min(bin, 1023) + 1) / 1024f * maxMag;
                  float high = pv * (0.55f - 0.42f * d);
                  float low = high * 0.4f;

                  // 4) NMS + hysteresis
                  boolean[] cand = new boolean[n];
                  boolean[] edge = new boolean[n];
                  int[] stack = new int[n];
                  int sp = 0;
                  for (int y = 1; y < h - 1; y++) {
                      for (int x = 1; x < w - 1; x++) {
                          int i = y * w + x;
                          float m = mag[i];
                          if (m < low) continue;
                          float ax = Math.abs(gx[i]), ay = Math.abs(gy[i]);
                          float m1, m2;
                          if (ay <= 0.4142f * ax) { m1 = mag[i - 1]; m2 = mag[i + 1]; }
                          else if (ay >= 2.4142f * ax) { m1 = mag[i - w]; m2 = mag[i + w]; }
                          else if ((gx[i] > 0) == (gy[i] > 0)) { m1 = mag[i - w - 1]; m2 = mag[i + w + 1]; }
                          else { m1 = mag[i - w + 1]; m2 = mag[i + w - 1]; }
                          if (m >= m1 && m > m2) {
                              cand[i] = true;
                              if (m >= high) { edge[i] = true; stack[sp++] = i; }
                          }
                      }
                  }
                  while (sp > 0) {
                      int i = stack[--sp];
                      int x = i % w, y = i / w;
                      for (int k = 0; k < 8; k++) {
                          int nx = x + DX[k], ny = y + DY[k];
                          if (nx < 1 || ny < 1 || nx >= w - 1 || ny >= h - 1) continue;
                          int ni = ny * w + nx;
                          if (cand[ni] && !edge[ni]) { edge[ni] = true; stack[sp++] = ni; }
                      }
                  }

                  // 5) تنحيف إلى بكسل واحد
                  thin(edge, w, h);

                  return finish(edge, w, h, detail, res);
              }

              /** المراحل 6-8: تتبع الخطوط من هيكل بكسل واحد ثم التصفية والتبسيط والترتيب. */
              static Result finish(boolean[] edge, int w, int h, int detail, Result res) {
                  int n = w * h;
                  // 6) تتبع الخطوط: نبدأ من الأطراف ثم الحلقات
                  boolean[] used = new boolean[n];
                  List<IL> raw = new ArrayList<>();
                  for (int pass = 0; pass < 2; pass++) {
                      for (int y = 1; y < h - 1; y++) {
                          for (int x = 1; x < w - 1; x++) {
                              int i = y * w + x;
                              if (!edge[i] || used[i]) continue;
                              if (pass == 0 && freeNeighbors(edge, used, x, y, w, h) != 1) continue;
                              raw.add(traceFrom(x, y, edge, used, w, h));
                          }
                      }
                  }

                  // 7) تصفية القصير + تبسيط + حساب الحدود
                  int minLen = (int) (8 + (100 - detail) * 0.35f);
                  List<float[]> strokes = new ArrayList<>();
                  float minX = 1e9f, minY = 1e9f, maxX = -1e9f, maxY = -1e9f;
                  for (IL p : raw) {
                      int cnt = p.n / 2;
                      if (cnt < minLen) continue;
                      float[] s = simplify(p, 0.9f);
                      if (s.length < 4) continue;
                      for (int k = 0; k < s.length; k += 2) {
                          minX = Math.min(minX, s[k]); maxX = Math.max(maxX, s[k]);
                          minY = Math.min(minY, s[k + 1]); maxY = Math.max(maxY, s[k + 1]);
                      }
                      strokes.add(s);
                  }
                  if (strokes.isEmpty()) return res;

                  // قص الهوامش الفارغة: الرسم يملأ اللوحة بأكبر حجم ممكن
                  for (float[] s : strokes) {
                      for (int k = 0; k < s.length; k += 2) { s[k] -= minX; s[k + 1] -= minY; }
                  }
                  res.w = (int) Math.ceil(maxX - minX) + 1;
                  res.h = (int) Math.ceil(maxY - minY) + 1;

                  // 8) ترتيب الخطوط بالأقرب فالأقرب
                  res.strokes = order(strokes);
                  float total = 0;
                  for (float[] s : res.strokes) {
                      for (int k = 2; k < s.length; k += 2) {
                          total += (float) Math.hypot(s[k] - s[k - 2], s[k + 1] - s[k - 1]);
                      }
                  }
                  res.totalLen = total;
                  return res;
              }

              /** مسار الرسم الخطي (ناتج الذكاء الاصطناعي): خطوط سوداء على أبيض، فلا حاجة لكشف الحواف؛ عتبة ثم تنحيف ثم نفس التتبع. */
              static Result traceLines(int[] argb, int w, int h, int detail) {
                  int n = w * h;
                  Result res = new Result();
                  res.w = w;
                  res.h = h;
                  int[] hist = new int[256];
                  float[] gray = new float[n];
                  for (int i = 0; i < n; i++) {
                      int c = argb[i];
                      float a = ((c >>> 24) & 255) / 255f;
                      float r = ((c >> 16) & 255) * a + 255f * (1 - a);
                      float g = ((c >> 8) & 255) * a + 255f * (1 - a);
                      float b = (c & 255) * a + 255f * (1 - a);
                      float v = 0.299f * r + 0.587f * g + 0.114f * b;
                      gray[i] = v;
                      hist[Math.min(255, (int) v)]++;
                  }
                  long sumAll = 0;
                  for (int t = 0; t < 256; t++) sumAll += (long) t * hist[t];
                  long wB = 0, sumB = 0;
                  double best = -1;
                  int thr = 128;
                  for (int t = 0; t < 256; t++) {
                      wB += hist[t];
                      if (wB == 0) continue;
                      long wF = n - wB;
                      if (wF == 0) break;
                      sumB += (long) t * hist[t];
                      double mB = (double) sumB / wB, mF = (double) (sumAll - sumB) / wF;
                      double between = (double) wB * wF * (mB - mF) * (mB - mF);
                      if (between > best) { best = between; thr = t; }
                  }
                  thr = Math.max(70, Math.min(190, thr));
                  boolean[] edge = new boolean[n];
                  int dark = 0;
                  for (int i = 0; i < n; i++) {
                      if (gray[i] < thr) { edge[i] = true; dark++; }
                  }
                  if (dark > n * 0.5) {
                      for (int i = 0; i < n; i++) edge[i] = !edge[i];
                  }
                  for (int x = 0; x < w; x++) { edge[x] = false; edge[(h - 1) * w + x] = false; }
                  for (int y = 0; y < h; y++) { edge[y * w] = false; edge[y * w + w - 1] = false; }
                  thin(edge, w, h);
                  return finish(edge, w, h, detail, res);
              }

              static float[] blur(float[] src, int w, int h, float sigma) {
                  int r = Math.max(1, (int) Math.ceil(sigma * 2.5f));
                  float[] k = new float[2 * r + 1];
                  float sum = 0;
                  for (int i = -r; i <= r; i++) {
                      k[i + r] = (float) Math.exp(-(i * i) / (2 * sigma * sigma));
                      sum += k[i + r];
                  }
                  for (int i = 0; i < k.length; i++) k[i] /= sum;
                  float[] tmp = new float[w * h], out = new float[w * h];
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          float s = 0;
                          for (int i = -r; i <= r; i++) {
                              int xx = Math.min(w - 1, Math.max(0, x + i));
                              s += src[y * w + xx] * k[i + r];
                          }
                          tmp[y * w + x] = s;
                      }
                  }
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          float s = 0;
                          for (int i = -r; i <= r; i++) {
                              int yy = Math.min(h - 1, Math.max(0, y + i));
                              s += tmp[yy * w + x] * k[i + r];
                          }
                          out[y * w + x] = s;
                      }
                  }
                  return out;
              }

              /** Zhang-Suen */
              static void thin(boolean[] im, int w, int h) {
                  int[] buf = new int[w * h];
                  boolean changed;
                  do {
                      changed = false;
                      for (int step = 0; step < 2; step++) {
                          int cnt = 0;
                          for (int y = 1; y < h - 1; y++) {
                              for (int x = 1; x < w - 1; x++) {
                                  int i = y * w + x;
                                  if (!im[i]) continue;
                                  boolean p2 = im[i - w], p3 = im[i - w + 1], p4 = im[i + 1], p5 = im[i + w + 1];
                                  boolean p6 = im[i + w], p7 = im[i + w - 1], p8 = im[i - 1], p9 = im[i - w - 1];
                                  int b = (p2 ? 1 : 0) + (p3 ? 1 : 0) + (p4 ? 1 : 0) + (p5 ? 1 : 0)
                                          + (p6 ? 1 : 0) + (p7 ? 1 : 0) + (p8 ? 1 : 0) + (p9 ? 1 : 0);
                                  if (b < 2 || b > 6) continue;
                                  int a = 0;
                                  if (!p2 && p3) a++;
                                  if (!p3 && p4) a++;
                                  if (!p4 && p5) a++;
                                  if (!p5 && p6) a++;
                                  if (!p6 && p7) a++;
                                  if (!p7 && p8) a++;
                                  if (!p8 && p9) a++;
                                  if (!p9 && p2) a++;
                                  if (a != 1) continue;
                                  if (step == 0) {
                                      if (p2 && p4 && p6) continue;
                                      if (p4 && p6 && p8) continue;
                                  } else {
                                      if (p2 && p4 && p8) continue;
                                      if (p2 && p6 && p8) continue;
                                  }
                                  buf[cnt++] = i;
                              }
                          }
                          for (int k = 0; k < cnt; k++) im[buf[k]] = false;
                          if (cnt > 0) changed = true;
                      }
                  } while (changed);
              }

              static int freeNeighbors(boolean[] edge, boolean[] used, int x, int y, int w, int h) {
                  int c = 0;
                  for (int k = 0; k < 8; k++) {
                      int nx = x + DX[k], ny = y + DY[k];
                      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                      int ni = ny * w + nx;
                      if (edge[ni] && !used[ni]) c++;
                  }
                  return c;
              }

              static IL traceFrom(int sx, int sy, boolean[] edge, boolean[] used, int w, int h) {
                  used[sy * w + sx] = true;
                  IL f = new IL();
                  f.add(sx); f.add(sy);
                  extend(f, edge, used, w, h);
                  IL b = new IL();
                  b.add(sx); b.add(sy);
                  extend(b, edge, used, w, h);
                  IL out = new IL();
                  for (int k = b.n / 2 - 1; k >= 1; k--) { out.add(b.a[2 * k]); out.add(b.a[2 * k + 1]); }
                  for (int k = 0; k < f.n / 2; k++) { out.add(f.a[2 * k]); out.add(f.a[2 * k + 1]); }
                  int cnt = out.n / 2;
                  if (cnt > 10) {
                      int fx = out.a[0], fy = out.a[1], lx = out.a[out.n - 2], ly = out.a[out.n - 1];
                      double dist = Math.hypot(fx - lx, fy - ly);
                      if (dist > 0 && dist <= 2.5) { out.add(fx); out.add(fy); }
                  }
                  return out;
              }

              static void extend(IL p, boolean[] edge, boolean[] used, int w, int h) {
                  while (true) {
                      int k = p.n / 2;
                      int cx = p.a[2 * k - 2], cy = p.a[2 * k - 1];
                      float vx = 0, vy = 0;
                      if (k >= 2) {
                          int b = Math.max(0, k - 7);
                          vx = cx - p.a[2 * b];
                          vy = cy - p.a[2 * b + 1];
                          float l = (float) Math.sqrt(vx * vx + vy * vy);
                          if (l > 0) { vx /= l; vy /= l; }
                      }
                      int best = -1;
                      float bs = -9;
                      for (int d = 0; d < 8; d++) {
                          int nx = cx + DX[d], ny = cy + DY[d];
                          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                          int ni = ny * w + nx;
                          if (!edge[ni] || used[ni]) continue;
                          float sc;
                          if (k < 2) sc = (d % 2 == 0) ? 1f : 0.9f;
                          else {
                              float l = (d % 2 == 0) ? 1f : 1.4142f;
                              sc = (DX[d] * vx + DY[d] * vy) / l;
                          }
                          if (sc > bs) { bs = sc; best = d; }
                      }
                      if (best >= 0) {
                          int nx = cx + DX[best], ny = cy + DY[best];
                          used[ny * w + nx] = true;
                          p.add(nx); p.add(ny);
                          continue;
                      }
                      if (k < 2) break;
                      // سدّ فجوة صغيرة بالاتجاه الأمامي
                      int bx = -1, by = -1;
                      float bscore = 1e9f;
                      for (int dy = -GAP; dy <= GAP; dy++) {
                          for (int dx = -GAP; dx <= GAP; dx++) {
                              float dist = (float) Math.sqrt(dx * dx + dy * dy);
                              if (dist < 1.5f || dist > GAP) continue;
                              int nx = cx + dx, ny = cy + dy;
                              if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                              int ni = ny * w + nx;
                              if (!edge[ni] || used[ni]) continue;
                              float dot = (dx * vx + dy * vy) / dist;
                              if (dot < 0.6f) continue;
                              float score = dist - dot;
                              if (score < bscore) { bscore = score; bx = nx; by = ny; }
                          }
                      }
                      if (bx < 0) break;
                      used[by * w + bx] = true;
                      p.add(bx); p.add(by);
                  }
              }

              /** Douglas-Peucker */
              static float[] simplify(IL p, float eps) {
                  int n = p.n / 2;
                  boolean[] keep = new boolean[n];
                  keep[0] = true;
                  keep[n - 1] = true;
                  ArrayDeque<int[]> st = new ArrayDeque<>();
                  st.push(new int[]{0, n - 1});
                  while (!st.isEmpty()) {
                      int[] r = st.pop();
                      int a = r[0], b = r[1];
                      if (b <= a + 1) continue;
                      float ax = p.a[2 * a], ay = p.a[2 * a + 1], bx = p.a[2 * b], by = p.a[2 * b + 1];
                      float dx = bx - ax, dy = by - ay;
                      float len = (float) Math.sqrt(dx * dx + dy * dy);
                      float md = -1;
                      int mi = -1;
                      for (int i = a + 1; i < b; i++) {
                          float px = p.a[2 * i], py = p.a[2 * i + 1];
                          float dd;
                          if (len == 0) dd = (float) Math.hypot(px - ax, py - ay);
                          else dd = Math.abs(dy * px - dx * py + bx * ay - by * ax) / len;
                          if (dd > md) { md = dd; mi = i; }
                      }
                      if (md > eps) {
                          keep[mi] = true;
                          st.push(new int[]{a, mi});
                          st.push(new int[]{mi, b});
                      }
                  }
                  int c = 0;
                  for (boolean k : keep) if (k) c++;
                  float[] out = new float[c * 2];
                  int j = 0;
                  for (int i = 0; i < n; i++) {
                      if (keep[i]) { out[j++] = p.a[2 * i]; out[j++] = p.a[2 * i + 1]; }
                  }
                  return out;
              }

              static List<float[]> order(List<float[]> in) {
                  List<float[]> rest = new ArrayList<>(in);
                  List<float[]> out = new ArrayList<>();
                  float cx = 0, cy = 0;
                  while (!rest.isEmpty()) {
                      int bi = 0;
                      boolean rev = false;
                      float bd = 1e18f;
                      for (int i = 0; i < rest.size(); i++) {
                          float[] s = rest.get(i);
                          float d1 = (s[0] - cx) * (s[0] - cx) + (s[1] - cy) * (s[1] - cy);
                          float ex = s[s.length - 2], ey = s[s.length - 1];
                          float d2 = (ex - cx) * (ex - cx) + (ey - cy) * (ey - cy);
                          if (d1 < bd) { bd = d1; bi = i; rev = false; }
                          if (d2 < bd) { bd = d2; bi = i; rev = true; }
                      }
                      float[] s = rest.remove(bi);
                      if (rev) {
                          float[] r = new float[s.length];
                          for (int k = 0; k < s.length; k += 2) {
                              r[k] = s[s.length - 2 - k];
                              r[k + 1] = s[s.length - 1 - k];
                          }
                          s = r;
                      }
                      out.add(s);
                      cx = s[s.length - 2];
                      cy = s[s.length - 1];
                  }
                  return out;
              }
          }
          EOF

          cat > app/src/main/java/com/autodraw/AiLines.java <<'EOF'
          package com.autodraw;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.util.Base64;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import org.json.JSONArray;
          import org.json.JSONObject;

          /** مهمته الوحيدة: إرسال الصورة لنموذج ذكاء اصطناعي ليعيد رسماً خطياً نظيفاً (أسود على أبيض). لا يتدخل في أي شيء آخر. */
          class AiLines {
              static final String PROMPT = "Convert this image into a clean, accurate line drawing. "
                      + "Output ONLY the image: thin, crisp, continuous black outlines on a pure white background. "
                      + "Keep the exact same composition, framing, aspect ratio, proportions and positions as the original. "
                      + "Draw only the real contours and the important inner lines. "
                      + "Do not add, remove, move, stylize or invent anything. "
                      + "No shading, no fills, no gray tones, no text, no border, no watermark.";

              static Bitmap extract(Bitmap src, String apiKey, String model) throws Exception {
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  src.compress(Bitmap.CompressFormat.JPEG, 92, bo);
                  String b64 = Base64.encodeToString(bo.toByteArray(), Base64.NO_WRAP);

                  JSONObject img = new JSONObject().put("mime_type", "image/jpeg").put("data", b64);
                  JSONArray parts = new JSONArray()
                          .put(new JSONObject().put("text", PROMPT))
                          .put(new JSONObject().put("inline_data", img));
                  JSONObject body = new JSONObject()
                          .put("contents", new JSONArray().put(new JSONObject().put("parts", parts)))
                          .put("generationConfig", new JSONObject()
                                  .put("responseModalities", new JSONArray().put("TEXT").put("IMAGE")));

                  URL url = new URL("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent");
                  HttpURLConnection c = (HttpURLConnection) url.openConnection();
                  c.setRequestMethod("POST");
                  c.setConnectTimeout(30000);
                  c.setReadTimeout(120000);
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "application/json");
                  c.setRequestProperty("x-goog-api-key", apiKey);
                  byte[] data = body.toString().getBytes("UTF-8");
                  try (OutputStream os = c.getOutputStream()) {
                      os.write(data);
                  }
                  int code = c.getResponseCode();
                  InputStream is = (code >= 200 && code < 300) ? c.getInputStream() : c.getErrorStream();
                  String resp = readAll(is);
                  c.disconnect();
                  if (code < 200 || code >= 300) throw new Exception("HTTP " + code + " " + shorten(resp));

                  JSONObject root = new JSONObject(resp);
                  JSONArray cands = root.optJSONArray("candidates");
                  if (cands == null || cands.length() == 0) throw new Exception("لم يرجع النموذج نتيجة");
                  JSONObject content = cands.getJSONObject(0).optJSONObject("content");
                  JSONArray ps = content == null ? null : content.optJSONArray("parts");
                  if (ps == null) throw new Exception("لم يرجع النموذج صورة");
                  for (int i = 0; i < ps.length(); i++) {
                      JSONObject p = ps.getJSONObject(i);
                      JSONObject inl = p.optJSONObject("inlineData");
                      if (inl == null) inl = p.optJSONObject("inline_data");
                      if (inl == null) continue;
                      String d = inl.optString("data", "");
                      if (d.length() == 0) continue;
                      byte[] bytes = Base64.decode(d, Base64.DEFAULT);
                      Bitmap bm = BitmapFactory.decodeByteArray(bytes, 0, bytes.length);
                      if (bm == null) continue;
                      Bitmap flat = Bitmap.createBitmap(bm.getWidth(), bm.getHeight(), Bitmap.Config.ARGB_8888);
                      Canvas cv = new Canvas(flat);
                      cv.drawColor(Color.WHITE);
                      cv.drawBitmap(bm, 0, 0, null);
                      return flat;
                  }
                  throw new Exception("لم يرجع النموذج صورة");
              }

              static String readAll(InputStream is) throws Exception {
                  if (is == null) return "";
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = is.read(buf)) > 0) bo.write(buf, 0, n);
                  is.close();
                  return bo.toString("UTF-8");
              }

              static String shorten(String s) {
                  if (s == null) return "";
                  s = s.replace('\n', ' ');
                  return s.length() > 160 ? s.substring(0, 160) : s;
              }
          }
