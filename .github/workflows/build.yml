name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/autodraw app/src/main/res/xml app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AutoDraw"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.autodraw'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.autodraw'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="رسام تلقائي"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".DrawService"
                      android:exported="true"
                      android:label="رسام تلقائي"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:canPerformGestures="true"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:description="@string/desc"
              android:notificationTimeout="100" />
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="desc">يسمح لتطبيق الرسم التلقائي بتنفيذ حركات الرسم على الشاشة فقط.</string>
          </resources>
          EOF

          cat > app/src/main/java/com/autodraw/Tracer.java <<'EOF'
          package com.autodraw;

          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.graphics.Paint;
          import java.util.ArrayList;
          import java.util.List;

          class Tracer {
              static class Result {
                  List<int[]> strokes = new ArrayList<>();
                  Bitmap preview;
                  int w, h;
              }

              static Result trace(Bitmap src, int thr) {
                  int w = src.getWidth(), h = src.getHeight();
                  int n = w * h;
                  int[] px = new int[n];
                  src.getPixels(px, 0, w, 0, 0, w, h);
                  int[] g = new int[n];
                  for (int i = 0; i < n; i++) {
                      int c = px[i];
                      g[i] = (int) (0.299 * Color.red(c) + 0.587 * Color.green(c) + 0.114 * Color.blue(c));
                  }

                  // تنعيم بسيط 3x3
                  int[] bl = new int[n];
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          int sum = 0;
                          for (int j = -1; j <= 1; j++) {
                              for (int k = -1; k <= 1; k++) {
                                  int yy = Math.min(h - 1, Math.max(0, y + j));
                                  int xx = Math.min(w - 1, Math.max(0, x + k));
                                  sum += g[yy * w + xx];
                              }
                          }
                          bl[y * w + x] = sum / 9;
                      }
                  }

                  // Sobel
                  int[] gx = new int[n], gy = new int[n], mag = new int[n];
                  for (int y = 1; y < h - 1; y++) {
                      for (int x = 1; x < w - 1; x++) {
                          int i = y * w + x;
                          int sx = -bl[i - w - 1] - 2 * bl[i - 1] - bl[i + w - 1] + bl[i - w + 1] + 2 * bl[i + 1] + bl[i + w + 1];
                          int sy = -bl[i - w - 1] - 2 * bl[i - w] - bl[i - w + 1] + bl[i + w - 1] + 2 * bl[i + w] + bl[i + w + 1];
                          gx[i] = sx;
                          gy[i] = sy;
                          mag[i] = Math.abs(sx) + Math.abs(sy);
                      }
                  }

                  // تنحيف الحواف (non-max suppression)
                  boolean[] edge = new boolean[n];
                  for (int y = 1; y < h - 1; y++) {
                      for (int x = 1; x < w - 1; x++) {
                          int i = y * w + x;
                          if (mag[i] < thr) continue;
                          int a, b;
                          if (Math.abs(gx[i]) > Math.abs(gy[i])) {
                              a = mag[i - 1];
                              b = mag[i + 1];
                          } else {
                              a = mag[i - w];
                              b = mag[i + w];
                          }
                          edge[i] = mag[i] >= a && mag[i] > b;
                      }
                  }

                  // تتبع الحواف وتحويلها إلى خطوط
                  Result r = new Result();
                  r.w = w;
                  r.h = h;
                  boolean[] seen = new boolean[n];
                  int[] dx = {1, -1, 0, 0, 1, 1, -1, -1};
                  int[] dy = {0, 0, 1, -1, 1, -1, 1, -1};
                  for (int y = 0; y < h; y++) {
                      for (int x = 0; x < w; x++) {
                          int i = y * w + x;
                          if (!edge[i] || seen[i]) continue;
                          List<Integer> path = new ArrayList<>();
                          int cx = x, cy = y;
                          while (true) {
                              seen[cy * w + cx] = true;
                              path.add(cx);
                              path.add(cy);
                              boolean moved = false;
                              for (int d = 0; d < 8; d++) {
                                  int nx = cx + dx[d], ny = cy + dy[d];
                                  if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                                  int ni = ny * w + nx;
                                  if (edge[ni] && !seen[ni]) {
                                      cx = nx;
                                      cy = ny;
                                      moved = true;
                                      break;
                                  }
                              }
                              if (!moved) break;
                          }
                          int cnt = path.size() / 2;
                          if (cnt < 6) continue;
                          List<Integer> out = new ArrayList<>();
                          for (int k = 0; k < cnt; k += 2) {
                              out.add(path.get(k * 2));
                              out.add(path.get(k * 2 + 1));
                          }
                          if ((cnt - 1) % 2 != 0) {
                              out.add(path.get((cnt - 1) * 2));
                              out.add(path.get((cnt - 1) * 2 + 1));
                          }
                          int[] s = new int[out.size()];
                          for (int k = 0; k < s.length; k++) s[k] = out.get(k);
                          r.strokes.add(s);
                      }
                  }

                  // صورة معاينة لما سيتم رسمه
                  int sc = 3;
                  Bitmap p = Bitmap.createBitmap(w * sc, h * sc, Bitmap.Config.ARGB_8888);
                  Canvas cv = new Canvas(p);
                  cv.drawColor(Color.WHITE);
                  Paint paint = new Paint();
                  paint.setColor(Color.BLACK);
                  paint.setStrokeWidth(2f);
                  paint.setAntiAlias(true);
                  for (int[] s : r.strokes) {
                      for (int k = 2; k < s.length; k += 2) {
                          cv.drawLine(s[k - 2] * sc, s[k - 1] * sc, s[k] * sc, s[k + 1] * sc, paint);
                      }
                  }
                  r.preview = p;
                  return r;
              }
          }
          EOF

          cat > app/src/main/java/com/autodraw/MainActivity.java <<'EOF'
          package com.autodraw;

          import android.app.Activity;
          import android.content.Intent;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.io.InputStream;

          public class MainActivity extends Activity {
              Bitmap bmp;
              Tracer.Result result;
              ImageView preview;
              TextView info;
              SeekBar detail;

              @Override
              protected void onCreate(Bundle s) {
                  super.onCreate(s);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(40, 80, 40, 40);

                  Button b1 = new Button(this);
                  b1.setText("1) تفعيل خدمة الرسم");
                  b1.setOnClickListener(v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)));

                  Button b2 = new Button(this);
                  b2.setText("2) اختيار صورة");
                  b2.setOnClickListener(v -> {
                      Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                      i.setType("image/*");
                      startActivityForResult(i, 1);
                  });

                  TextView t = new TextView(this);
                  t.setText("مستوى التفاصيل:");

                  detail = new SeekBar(this);
                  detail.setMax(100);
                  detail.setProgress(55);
                  detail.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar sb, int p, boolean user) { process(); }
                      @Override public void onStartTrackingTouch(SeekBar sb) {}
                      @Override public void onStopTrackingTouch(SeekBar sb) {}
                  });

                  preview = new ImageView(this);
                  preview.setBackgroundColor(Color.WHITE);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);

                  info = new TextView(this);

                  Button b3 = new Button(this);
                  b3.setText("3) ابدأ");
                  b3.setOnClickListener(v -> start());

                  TextView ver = new TextView(this);
          ver.setText("الإصدار 3");
          root.addView(ver);
          root.addView(b1);
                  root.addView(b2);
                  root.addView(t);
                  root.addView(detail);
                  root.addView(preview, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f));
                  root.addView(info);
                  root.addView(b3);
                  setContentView(root);
              }

              @Override
              protected void onActivityResult(int rc, int res, Intent data) {
                  super.onActivityResult(rc, res, data);
                  if (rc == 1 && res == RESULT_OK && data != null && data.getData() != null) {
                      load(data.getData());
                  }
              }

              void load(Uri uri) {
                  try {
                      BitmapFactory.Options o = new BitmapFactory.Options();
                      o.inJustDecodeBounds = true;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          BitmapFactory.decodeStream(in, null, o);
                      }
                      int ss = 1;
                      while (Math.max(o.outWidth, o.outHeight) / ss > 1000) ss *= 2;
                      o = new BitmapFactory.Options();
                      o.inSampleSize = ss;
                      Bitmap full;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          full = BitmapFactory.decodeStream(in, null, o);
                      }
                      float k = 240f / Math.max(full.getWidth(), full.getHeight());
                      int w = Math.max(1, (int) (full.getWidth() * k));
                      int h = Math.max(1, (int) (full.getHeight() * k));
                      Bitmap scaled = Bitmap.createScaledBitmap(full, w, h, true);
                      bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
                      Canvas c = new Canvas(bmp);
                      c.drawColor(Color.WHITE);
                      c.drawBitmap(scaled, 0, 0, null);
                      process();
                  } catch (Exception e) {
                      Toast.makeText(this, "تعذر فتح الصورة", Toast.LENGTH_SHORT).show();
                  }
              }

              void process() {
                  if (bmp == null) return;
                  int thr = 600 - detail.getProgress() * 5;
                  result = Tracer.trace(bmp, thr);
                  preview.setImageBitmap(result.preview);
                  info.setText("عدد الخطوط: " + result.strokes.size());
              }

              void start() {
                  if (result == null || result.strokes.isEmpty()) {
                      Toast.makeText(this, "اختر صورة أولاً", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  if (DrawService.instance == null) {
                      Toast.makeText(this, "فعّل الخدمة أولاً", Toast.LENGTH_LONG).show();
                      startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS));
                      return;
                  }
                  DrawService.strokes = result.strokes;
                  DrawService.imgW = result.w;
                  DrawService.imgH = result.h;
                  DrawService.instance.showFab();
                  Toast.makeText(this, "افتح اللعبة ثم اضغط زر 🎨", Toast.LENGTH_LONG).show();
                  moveTaskToBack(true);
              }
          }
          EOF

          cat > app/src/main/java/com/autodraw/DrawService.java <<'EOF'
          package com.autodraw;

          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.content.Intent;
          import android.graphics.Color;
          import android.graphics.Path;
          import android.graphics.PixelFormat;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.WindowManager;
          import android.view.accessibility.AccessibilityEvent;
          import android.widget.FrameLayout;
          import android.widget.TextView;
          import android.widget.Toast;
          import java.util.List;

          public class DrawService extends AccessibilityService {
              static DrawService instance;
              static List<int[]> strokes;
              static int imgW, imgH;
              static final int MS_PER_POINT = 25;

              WindowManager wm;
              TextView fab;
              WindowManager.LayoutParams fabLp;
              FrameLayout calib;
              TextView calibText;
              final Handler h = new Handler(Looper.getMainLooper());
              boolean drawing, cancel;
              float cx1, cy1;
              int taps;
          int okCount, failCount;

              @Override
              protected void onServiceConnected() {
                  instance = this;
                  wm = (WindowManager) getSystemService(WINDOW_SERVICE);
              }

              @Override public void onAccessibilityEvent(AccessibilityEvent e) {}
              @Override public void onInterrupt() {}

              @Override
              public boolean onUnbind(Intent i) {
                  instance = null;
                  hideAll();
                  return super.onUnbind(i);
              }

              void hideAll() {
                  try { if (fab != null) wm.removeView(fab); } catch (Exception e) {}
                  try { if (calib != null) wm.removeView(calib); } catch (Exception e) {}
                  fab = null;
                  calib = null;
              }

              void showFab() {
                  if (fab != null) return;
                  fab = new TextView(this);
                  fab.setText("🎨");
                  fab.setTextSize(26);
                  fab.setGravity(Gravity.CENTER);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setShape(GradientDrawable.OVAL);
                  bg.setColor(0xCC3F51B5);
                  fab.setBackground(bg);
                  int size = (int) (56 * getResources().getDisplayMetrics().density);
                  fabLp = new WindowManager.LayoutParams(size, size,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT);
                  fabLp.gravity = Gravity.TOP | Gravity.LEFT;
                  fabLp.x = getResources().getDisplayMetrics().widthPixels - size - 20;
                  fabLp.y = 400;
                  fab.setOnTouchListener(new View.OnTouchListener() {
                      float sx, sy;
                      int ox, oy;
                      boolean moved;

                      @Override
                      public boolean onTouch(View v, MotionEvent e) {
                          switch (e.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  sx = e.getRawX();
                                  sy = e.getRawY();
                                  ox = fabLp.x;
                                  oy = fabLp.y;
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  if (!moved && Math.abs(e.getRawX() - sx) + Math.abs(e.getRawY() - sy) > 20) moved = true;
                                  if (moved) {
                                      fabLp.x = (int) (ox + e.getRawX() - sx);
                                      fabLp.y = (int) (oy + e.getRawY() - sy);
                                      wm.updateViewLayout(fab, fabLp);
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                                  if (!moved) onFabClick();
                                  return true;
                          }
                          return false;
                      }
                  });
                  wm.addView(fab, fabLp);
              }

              void onFabClick() {
                  if (drawing) {
                      cancel = true;
                  } else if (calib == null) {
                      startCalibration();
                  }
              }

              void startCalibration() {
                  if (strokes == null || strokes.isEmpty()) return;
                  if (fab != null) { fab.setTextSize(26); fab.setText("🎨"); }
                  taps = 0;
                  calib = new FrameLayout(this);
                  calib.setBackgroundColor(0x55000000);
                  calibText = new TextView(this);
                  calibText.setTextColor(Color.WHITE);
                  calibText.setTextSize(18);
                  calibText.setGravity(Gravity.CENTER);
                  calibText.setBackgroundColor(0xCC000000);
                  calibText.setPadding(30, 30, 30, 30);
                  calibText.setText("اضغط على الزاوية العلوية اليسرى للوحة الرسم");
                  calib.addView(calibText, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.TOP));
                  calib.setOnTouchListener((v, e) -> {
                      if (e.getAction() == MotionEvent.ACTION_UP) onCalibTap(e.getRawX(), e.getRawY());
                      return true;
                  });
                  WindowManager.LayoutParams lp = new WindowManager.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT,
                          WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN
                                  | WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                          PixelFormat.TRANSLUCENT);
                  wm.addView(calib, lp);
              }

              void onCalibTap(float x, float y) {
                  if (taps == 0) {
                      cx1 = x;
                      cy1 = y;
                      taps = 1;
                      calibText.setText("الآن اضغط على الزاوية السفلية اليمنى للوحة");
                      return;
                  }
                  try { wm.removeView(calib); } catch (Exception e) {}
                  calib = null;
                  final float fx1 = cx1, fy1 = cy1, fx2 = x, fy2 = y;
                  if (fx2 - fx1 < 100 || fy2 - fy1 < 100) {
                      Toast.makeText(this, "المنطقة غير صحيحة، اضغط الزر وحاول مرة أخرى", Toast.LENGTH_LONG).show();
                      return;
                  }
                  h.postDelayed(() -> beginDraw(fx1, fy1, fx2, fy2), 500);
              }

              void beginDraw(float x1, float y1, float x2, float y2) {
                  drawing = true;
                  cancel = false;
                  if (fab != null) {
                      fab.setTextSize(11);
                      fab.setText("⏹");
                      int size = fabLp.width;
                      int screenH = getResources().getDisplayMetrics().heightPixels;
                      int ny = (int) y2 + 15;
                      if (ny + size > screenH) ny = Math.max(0, (int) y1 - size - 15);
                      fabLp.x = (int) x1;
                      fabLp.y = ny;
                      try { wm.updateViewLayout(fab, fabLp); } catch (Exception e) {}
                  }
                  float rw = x2 - x1, rh = y2 - y1;
                  float sc = Math.min(rw / imgW, rh / imgH);
                  float ox = x1 + (rw - imgW * sc) / 2f;
                  float oy = y1 + (rh - imgH * sc) / 2f;
                  okCount = 0;
              failCount = 0;
              Toast.makeText(this, "بدأ الرسم: " + strokes.size() + " خط، المنطقة " + (int) rw + "x" + (int) rh, Toast.LENGTH_LONG).show();
              drawNext(0, ox, oy, sc);
              }

              void finishDraw(String msg) {
                  drawing = false;
                  cancel = false;
                  if (fab != null) { fab.setTextSize(11); fab.setText(okCount + "✓\n" + failCount + "✗"); }
                  Toast.makeText(this, msg + "  (نجح " + okCount + " / فشل " + failCount + ")", Toast.LENGTH_LONG).show();
              }

              void drawNext(int i, float ox, float oy, float sc) {
              try {
                  drawStroke(i, ox, oy, sc);
              } catch (Exception e) {
                  finishDraw("خطأ: " + e);
              }
          }

          void drawStroke(int i, float ox, float oy, float sc) {
                  if (cancel) { finishDraw("تم الإيقاف"); return; }
                  if (strokes == null || i >= strokes.size()) { finishDraw("انتهى الرسم"); return; }
                  int[] s = strokes.get(i);
                  if (fab != null) fab.setText("⏹\n" + i + "/" + strokes.size());
                  Path p = new Path();
                  p.moveTo(ox + s[0] * sc, oy + s[1] * sc);
                  for (int k = 2; k < s.length; k += 2) {
                      p.lineTo(ox + s[k] * sc, oy + s[k + 1] * sc);
                  }
                  long dur = Math.max(120, (long) (s.length / 2) * MS_PER_POINT);
                  GestureDescription gd = new GestureDescription.Builder()
                          .addStroke(new GestureDescription.StrokeDescription(p, 0, dur))
                          .build();
                  GestureResultCallback cb = new GestureResultCallback() {
                      @Override public void onCompleted(GestureDescription g) {
                          okCount++;
                          h.postDelayed(() -> drawNext(i + 1, ox, oy, sc), 30);
                      }
                      @Override public void onCancelled(GestureDescription g) {
                          failCount++;
                          h.postDelayed(() -> drawNext(i + 1, ox, oy, sc), 30);
                      }
                  };
                  if (!dispatchGesture(gd, cb, null)) {
                      failCount++;
                      h.postDelayed(() -> drawNext(i + 1, ox, oy, sc), 30);
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --repo "${{ github.repository }}" \
            --title "APK ${{ github.run_number }}" \
            --notes "AutoDraw"
