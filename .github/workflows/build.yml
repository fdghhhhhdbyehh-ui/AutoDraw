              class RegionView extends View {
                  final RectF r = new RectF();
                  final Paint fill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint line = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint hFill = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final Paint hLine = new Paint(Paint.ANTI_ALIAS_FLAG);
                  final float min = dp(80);
                  final float hitR = dp(44);
                  final float hr = dp(11);
                  final int sw = getResources().getDisplayMetrics().widthPixels;
                  final int sh = getResources().getDisplayMetrics().heightPixels;
                  int drag = -1; // 0=يسار-أعلى 1=يمين-أعلى 2=يمين-أسفل 3=يسار-أسفل 4=تحريك
                  float lx, ly;

                  RegionView(Context c, RectF init) {
                      super(c);
                      r.set(init);
                      fill.setColor(0x26FFFFFF);
                      line.setColor(0xFF0A84FF);
                      line.setStyle(Paint.Style.STROKE);
                      line.setStrokeWidth(dp(2.5f));
                      hFill.setColor(Color.WHITE);
                      hLine.setColor(0xFF0A84FF);
                      hLine.setStyle(Paint.Style.STROKE);
                      hLine.setStrokeWidth(dp(3));
                  }

                  float[] corner(int i) {
                      switch (i) {
                          case 0: return new float[]{r.left, r.top};
                          case 1: return new float[]{r.right, r.top};
                          case 2: return new float[]{r.right, r.bottom};
                          default: return new float[]{r.left, r.bottom};
                      }
                  }

                  @Override
                  protected void onDraw(Canvas cv) {
                      int[] loc = new int[2];
                      getLocationOnScreen(loc);
                      cv.translate(-loc[0], -loc[1]);
                      cv.drawRect(r, fill);
                      cv.drawRect(r, line);
                      for (int i = 0; i < 4; i++) {
                          float[] c = corner(i);
                          cv.drawCircle(c[0], c[1], hr, hFill);
                          cv.drawCircle(c[0], c[1], hr, hLine);
                      }
                  }

                  int hit(float x, float y) {
                      int best = -1;
                      float bd = hitR;
                      for (int i = 0; i < 4; i++) {
                          float[] c = corner(i);
                          float d = (float) Math.hypot(x - c[0], y - c[1]);
                          if (d < bd) { bd = d; best = i; }
                      }
                      if (best >= 0) return best;
                      return r.contains(x, y) ? 4 : -1;
                  }

                  @Override
                  public boolean onTouchEvent(MotionEvent e) {
                      float x = e.getRawX(), y = e.getRawY();
                      switch (e.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              drag = hit(x, y);
                              lx = x;
                              ly = y;
                              return drag >= 0;
                          case MotionEvent.ACTION_MOVE: {
                              if (drag < 0) return false;
                              float dx = x - lx, dy = y - ly;
                              lx = x;
                              ly = y;
                              if (drag == 4) {
                                  float w = r.width(), hh = r.height();
                                  float nl = Math.max(0, Math.min(sw - w, r.left + dx));
                                  float nt = Math.max(0, Math.min(sh - hh, r.top + dy));
                                  r.set(nl, nt, nl + w, nt + hh);
                              } else {
                                  if (drag == 0 || drag == 3) r.left = Math.max(0, Math.min(r.right - min, r.left + dx));
                                  if (drag == 1 || drag == 2) r.right = Math.min(sw, Math.max(r.left + min, r.right + dx));
                                  if (drag == 0 || drag == 1) r.top = Math.max(0, Math.min(r.bottom - min, r.top + dy));
                                  if (drag == 2 || drag == 3) r.bottom = Math.min(sh, Math.max(r.top + min, r.bottom + dy));
                              }
                              invalidate();
                              return true;
                          }
                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              drag = -1;
                              return true;
                      }
                      return false;
                  }
              }

              void openRegionSelector() {
                  if (regionOverlay != null) return;
                  int sw = getResources().getDisplayMetrics().widthPixels;
                  int sh = getResources().getDisplayMetrics().heightPixels;
                  RectF init;
                  if (region != null) init = new RectF(region);
                  else init = new RectF(sw * 0.15f, sh * 0.25f, sw * 0.85f, sh * 0.65f);

