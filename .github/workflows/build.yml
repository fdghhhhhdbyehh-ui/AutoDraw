          package com.autodraw;

          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.widget.Toast;

          /** نظام الاشتراك: محاولتان مجانيتان ثم رمز التفعيل. */
          final class License {
              static final String CODE = "asal";
              static final int FREE = 2;
              static final String WA_NUMBER = "9647892921403"; // 07892921403 بصيغة دولية (العراق)
              static final String WA_SHOW = "07892921403";

              static SharedPreferences p(Context c) {
                  return c.getSharedPreferences("lic", Context.MODE_PRIVATE);
              }

              static boolean unlocked(Context c) {
                  return p(c).getBoolean("u", false);
              }

              static int remaining(Context c) {
                  return Math.max(0, FREE - p(c).getInt("used", 0));
              }

              static boolean canUse(Context c) {
                  return unlocked(c) || remaining(c) > 0;
              }

              /** تُستهلك محاولة واحدة عند بدء رسمة فعلياً */
              static void consume(Context c) {
                  if (unlocked(c)) return;
                  p(c).edit().putInt("used", p(c).getInt("used", 0) + 1).apply();
              }

              static boolean tryCode(Context c, String s) {
                  if (s != null && s.trim().equalsIgnoreCase(CODE)) {
                      p(c).edit().putBoolean("u", true).apply();
                      return true;
                  }
                  return false;
              }

              static void openWhatsApp(Context c) {
                  try {
                      Intent i = new Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/" + WA_NUMBER));
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      c.startActivity(i);
                  } catch (Exception e) {
                      Toast.makeText(c, "تعذر فتح واتساب، رقمي: " + WA_SHOW, Toast.LENGTH_LONG).show();
                  }
              }
          }
